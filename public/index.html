<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBF8F5" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Lullaby" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<title>Lullaby — Baby Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#FBF8F5;min-height:100vh;color:#2C1A0E;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  :root{
    --rose:#F2D4CC;--rose-deep:#C4705A;--rose-text:#7A3020;
    --sky:#C8DCF0;--sky-deep:#4A80B8;--sky-text:#1A3D6B;
    --mint:#C8EAD8;--mint-deep:#3A9060;--mint-text:#1A5030;
    --lav:#DDD4F0;--lav-deep:#7060B8;--lav-text:#3A2878;
    --sun:#F5E4BC;--sun-deep:#C08030;--sun-text:#6A4010;
    --cream:#FBF8F5;--sand:#F2EDE8;--stone:#E4DCD4;
    --ink:#2C1A0E;--muted:#8C7060;--subtle:#B0A090;
    --card:#FFFFFF;--border:#E4DCD4;
    --shadow:0 2px 12px rgba(44,26,14,0.06);
    --shadow-lg:0 8px 32px rgba(44,26,14,0.10);
  }
  .app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;background:#FBF8F5}
  .header{padding:20px 20px 12px;position:sticky;top:0;z-index:40;background:#FBF8F5}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .logo{font-family:'DM Serif Display',serif;font-size:22px;color:#2C1A0E}
  .logo span{color:#C4705A;font-style:italic}
  .profile-row{display:flex;gap:8px;align-items:center}
  .profile-chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;background:var(--card);border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:all .15s}
  .profile-chip:hover{border-color:var(--rose-deep)}
  .profile-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .profile-name{font-size:13px;font-weight:500;color:var(--ink)}
  .add-profile-btn{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--subtle);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--subtle);font-size:18px;transition:all .15s}
  .add-profile-btn:hover{border-color:var(--rose-deep);color:var(--rose-deep)}
  .tabs{display:flex;padding:0 20px;gap:4px;margin-bottom:8px}
  .tab{flex:1;padding:8px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);border-radius:10px;cursor:pointer;transition:all .15s}
  .tab.active{background:var(--ink);color:white}
  .insights-strip{padding:0 20px 16px;overflow-x:auto;display:flex;gap:10px;scrollbar-width:none}
  .insights-strip::-webkit-scrollbar{display:none}
  .insight-card{min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);flex-shrink:0}
  .insight-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .insight-value{font-size:18px;font-weight:600;color:var(--ink)}
  .insight-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .insight-card.alert .insight-value{color:var(--rose-deep)}
  .insight-card.ok .insight-value{color:var(--mint-deep)}
  .active-banner{margin:0 20px 16px;padding:14px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;animation:pulse 2s infinite}
  .active-banner.sleep{background:var(--lav);border:1px solid var(--lav-deep)}
  .active-banner.feed{background:var(--rose);border:1px solid var(--rose-deep)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
  .active-info{display:flex;flex-direction:column;gap:2px}
  .active-title{font-size:13px;font-weight:600;color:var(--lav-text)}
  .active-timer{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--lav-text)}
  .active-banner.feed .active-title,.active-banner.feed .active-timer{color:var(--rose-text)}
  .stop-btn{padding:8px 16px;border-radius:100px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .active-banner.sleep .stop-btn{background:var(--lav-deep);color:white}
  .active-banner.feed .stop-btn{background:var(--rose-deep);color:white}
  .timeline{padding:0 20px;padding-bottom:120px}
  .day-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;padding-left:4px}
  .entry{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
  .entry-icon-wrap{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:2px}
  .entry-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .entry-row{display:flex;justify-content:space-between;align-items:center}
  .entry-title{font-size:14px;font-weight:600;color:var(--ink)}
  .entry-time{font-size:12px;color:var(--muted)}
  .entry-detail{font-size:12px;color:var(--muted);margin-top:3px}
  .entry-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px;margin-top:5px;display:inline-block}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
  .empty-text{font-size:15px}
  .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:white;border:none;border-radius:100px;padding:16px 32px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;z-index:50;transition:all .15s}
  .fab:hover{transform:translateX(-50%) scale(1.03);box-shadow:0 12px 40px rgba(44,26,14,0.18)}
  .fab:active{transform:translateX(-50%) scale(.97)}
  .overlay{position:fixed;inset:0;background:rgba(44,26,14,0.35);z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
  .sheet{background:var(--card);border-radius:24px 24px 0 0;padding:12px 20px calc(40px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideUp .22s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-handle{width:40px;height:4px;background:var(--stone);border-radius:100px;margin:0 auto 20px}
  .sheet-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);margin-bottom:20px}
  .log-type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
  .log-type-btn{padding:16px 8px;border-radius:16px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
  .log-type-btn:hover{border-color:var(--ink);transform:scale(1.02)}
  .log-type-btn.selected{border-color:var(--ink);background:var(--sand)}
  .log-type-icon{font-size:26px}
  .log-type-label{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--ink)}
  .field{margin-bottom:16px}
  .field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:block}
  .field-row{display:flex;gap:8px;flex-wrap:wrap}
  .chip-btn{padding:8px 14px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .12s}
  .chip-btn.active{background:var(--ink);color:white;border-color:var(--ink)}
  .text-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:border .15s}
  .text-input:focus{border-color:var(--ink)}
  .number-input{width:90px;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none}
  .submit-btn{width:100%;padding:14px;background:var(--ink);color:white;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s}
  .submit-btn:hover{opacity:.9}
  .submit-btn.secondary{background:var(--stone);color:var(--ink)}
  .back-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:12px;padding:0;font-family:'DM Sans',sans-serif}
  .analytics{padding:0 20px 120px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .stat-num{font-size:28px;font-weight:600;color:var(--ink)}
  .stat-label{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .bar-chart{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
  .bar-chart-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:80px}
  .bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .bar{width:100%;border-radius:6px 6px 0 0;min-height:4px}
  .bar-day{font-size:10px;color:var(--muted);font-weight:500}
  .bar-val{font-size:10px;color:var(--muted)}
  .profile-manager{padding:20px;padding-bottom:120px}
  .profile-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .15s}
  .profile-card:hover{border-color:var(--rose-deep)}
  .profile-card.current{border-color:var(--rose-deep);background:var(--rose)}
  .profile-info{display:flex;align-items:center;gap:12px}
  .profile-big-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
  .profile-details .name{font-size:15px;font-weight:600;color:var(--ink)}
  .profile-details .age{font-size:12px;color:var(--muted);margin-top:2px}
  .add-baby-card{background:transparent;border:1.5px dashed var(--subtle);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
  .add-baby-card:hover{border-color:var(--rose-deep)}
  .add-baby-text{font-size:14px;font-weight:500;color:var(--muted)}
  .section-header{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);margin-bottom:16px}
  .new-profile-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
  .color-picker{display:flex;gap:8px;flex-wrap:wrap}
  .color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .color-dot.selected{border-color:var(--ink)}
  .install-banner{margin:0 20px 12px;padding:12px 16px;background:var(--sun);border:1px solid var(--sun-deep);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .install-text{font-size:13px;color:var(--sun-text);font-weight:500}
  .install-btn{padding:6px 14px;background:var(--sun-deep);color:white;border:none;border-radius:100px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .dismiss-btn{background:none;border:none;cursor:pointer;color:var(--sun-text);font-size:16px;padding:0;line-height:1}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Storage helpers ──────────────────────────────────────────
const STORAGE_KEYS = { profiles: 'lullaby_profiles', logs: 'lullaby_logs', currentProfile: 'lullaby_current', activeSleep: 'lullaby_activeSleep', activeFeed: 'lullaby_activeFeed' };
function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

// ── Constants ────────────────────────────────────────────────
const COLORS = [
  {id:'rose',bg:'#F2D4CC',text:'#7A3020',dark:'#C4705A'},
  {id:'sky',bg:'#C8DCF0',text:'#1A3D6B',dark:'#4A80B8'},
  {id:'mint',bg:'#C8EAD8',text:'#1A5030',dark:'#3A9060'},
  {id:'lav',bg:'#DDD4F0',text:'#3A2878',dark:'#7060B8'},
  {id:'sun',bg:'#F5E4BC',text:'#6A4010',dark:'#C08030'},
];
const FEED_TYPES = ['Breast','Bottle','Solid'];
const BREAST_SIDES = ['Left','Right','Both'];
const DIAPER_TYPES = ['Pee','Poop','Both'];
const QUALITY = ['good','ok','rough'];
const LOG_TYPES = [
  {id:'feed',icon:'🍼',label:'Feed'},
  {id:'sleep',icon:'😴',label:'Sleep'},
  {id:'diaper',icon:'🧷',label:'Diaper'},
  {id:'pump',icon:'🤱',label:'Pump'},
  {id:'note',icon:'📝',label:'Note'},
];
const ENTRY_META = {
  feed:   {icon:'🍼',label:'Feed',  color:'#F2D4CC',tc:'#7A3020'},
  sleep:  {icon:'😴',label:'Sleep', color:'#DDD4F0',tc:'#3A2878'},
  diaper: {icon:'🧷',label:'Diaper',color:'#C8EAD8',tc:'#1A5030'},
  pump:   {icon:'🤱',label:'Pump',  color:'#C8DCF0',tc:'#1A3D6B'},
  note:   {icon:'📝',label:'Note',  color:'#F5E4BC',tc:'#6A4010'},
};

const DEFAULT_PROFILES = [{id:1,name:'Ayla',dob: new Date(Date.now()-74*86400000).toISOString().split('T')[0],color:'rose'}];
const DEFAULT_LOGS = [
  {id:1,profileId:1,type:'sleep',startTime:Date.now()-4.5*3600000,endTime:Date.now()-4*3600000,duration:1800,notes:'',quality:'good'},
  {id:2,profileId:1,type:'diaper',startTime:Date.now()-3*3600000,diaperType:'Pee',notes:''},
  {id:3,profileId:1,type:'feed',startTime:Date.now()-2.17*3600000,endTime:Date.now()-2*3600000,duration:600,feedType:'Breast',side:'Left',amount:'',notes:''},
  {id:4,profileId:1,type:'diaper',startTime:Date.now()-1.5*3600000,diaperType:'Both',notes:''},
];

// ── Helpers ───────────────────────────────────────────────────
function fmtDur(secs){if(!secs&&secs!==0)return'—';const m=Math.floor(secs/60),s=secs%60;if(m>=60)return`${Math.floor(m/60)}h ${m%60}m`;return`${m}m ${s<10?'0'+s:s}s`}
function fmtTime(ts){const d=new Date(ts);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'pm':'am';h=h%12||12;return`${h}:${m<10?'0'+m:m} ${ap}`}
function timeAgo(ts){const d=Math.floor((Date.now()-ts)/1000);if(d<60)return'just now';if(d<3600)return`${Math.floor(d/60)}m ago`;if(d<86400)return`${Math.floor(d/3600)}h ${Math.floor((d%3600)/60)}m ago`;return`${Math.floor(d/86400)}d ago`}
function dayLabel(ts){const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return'Today';const y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}
function getBabyAge(dob){if(!dob)return'';const days=Math.floor((Date.now()-new Date(dob))/86400000);if(days<30)return`${days}d old`;const m=Math.floor(days/30);return`${m}mo old`}
function groupByDay(items){const g={};items.forEach(l=>{const k=dayLabel(l.startTime);if(!g[k])g[k]=[];g[k].push(l);});return Object.entries(g)}

// ── Timer hook ────────────────────────────────────────────────
function useTimer(startTs){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{if(!startTs)return;const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[startTs]);
  return startTs?Math.floor((now-startTs)/1000):0;
}

// ── Sub-forms ─────────────────────────────────────────────────
function FeedForm({onSave,onStartTimer}){
  const [feedType,setFeedType]=useState('Breast');
  const [side,setSide]=useState('Left');
  const [amount,setAmount]=useState('');
  const [notes,setNotes]=useState('');
  const [timing,setTiming]=useState('now');
  return(
    <div>
      <div className="field"><span className="field-label">Type</span><div className="field-row">{FEED_TYPES.map(t=><button key={t} className={`chip-btn ${feedType===t?'active':''}`} onClick={()=>setFeedType(t)}>{t}</button>)}</div></div>
      {feedType==='Breast'&&<div className="field"><span className="field-label">Side</span><div className="field-row">{BREAST_SIDES.map(s=><button key={s} className={`chip-btn ${side===s?'active':''}`} onClick={()=>setSide(s)}>{s}</button>)}</div></div>}
      {feedType==='Bottle'&&<div className="field"><span className="field-label">Amount (ml)</span><input className="number-input" type="number" placeholder="e.g. 120" value={amount} onChange={e=>setAmount(e.target.value)}/></div>}
      <div className="field"><span className="field-label">Timing</span><div className="field-row"><button className={`chip-btn ${timing==='now'?'active':''}`} onClick={()=>setTiming('now')}>Start timer</button><button className={`chip-btn ${timing==='quick'?'active':''}`} onClick={()=>setTiming('quick')}>Log quick</button></div></div>
      <div className="field"><span className="field-label">Notes</span><input className="text-input" placeholder="Optional..." value={notes} onChange={e=>setNotes(e.target.value)}/></div>
      {timing==='now'
        ?<button className="submit-btn" onClick={()=>onStartTimer(feedType,side)}>▶ Start Feed Timer</button>
        :<button className="submit-btn" onClick={()=>onSave({type:'feed',startTime:Date.now(),feedType,side,amount,notes})}>Save Feed</button>}
    </div>
  );
}

function SleepForm({onSave,onStartTimer}){
  const [mode,setMode]=useState('now');
  const [quality,setQuality]=useState('good');
  return(
    <div>
      <div className="field"><span className="field-label">Mode</span><div className="field-row"><button className={`chip-btn ${mode==='now'?'active':''}`} onClick={()=>setMode('now')}>Start timer</button><button className={`chip-btn ${mode==='log'?'active':''}`} onClick={()=>setMode('log')}>Log past sleep</button></div></div>
      {mode==='log'&&<><div className="field"><span className="field-label">Quality</span><div className="field-row">{QUALITY.map(q=><button key={q} className={`chip-btn ${quality===q?'active':''}`} onClick={()=>setQuality(q)}>{q}</button>)}</div></div></>}
      {mode==='now'
        ?<button className="submit-btn" onClick={onStartTimer}>😴 Start Sleep Timer</button>
        :<button className="submit-btn" onClick={()=>onSave({type:'sleep',startTime:Date.now()-1800000,endTime:Date.now(),duration:1800,quality,notes:''})}>Save Sleep</button>}
    </div>
  );
}

function DiaperForm({onSave}){
  const [dtype,setDtype]=useState('Pee');
  const [notes,setNotes]=useState('');
  return(
    <div>
      <div className="field"><span className="field-label">Type</span><div className="field-row">{DIAPER_TYPES.map(t=><button key={t} className={`chip-btn ${dtype===t?'active':''}`} onClick={()=>setDtype(t)}>{t}</button>)}</div></div>
      <div className="field"><span className="field-label">Notes (colour, consistency...)</span><input className="text-input" placeholder="Optional..." value={notes} onChange={e=>setNotes(e.target.value)}/></div>
      <button className="submit-btn" onClick={()=>onSave({type:'diaper',startTime:Date.now(),diaperType:dtype,notes})}>Save Diaper</button>
    </div>
  );
}

function PumpForm({onSave}){
  const [amount,setAmount]=useState('');
  const [side,setSide]=useState('Both');
  return(
    <div>
      <div className="field"><span className="field-label">Side</span><div className="field-row">{BREAST_SIDES.map(s=><button key={s} className={`chip-btn ${side===s?'active':''}`} onClick={()=>setSide(s)}>{s}</button>)}</div></div>
      <div className="field"><span className="field-label">Amount (ml)</span><input className="number-input" type="number" placeholder="e.g. 80" value={amount} onChange={e=>setAmount(e.target.value)}/></div>
      <button className="submit-btn" onClick={()=>onSave({type:'pump',startTime:Date.now(),side,amount,notes:''})}>Save Pump</button>
    </div>
  );
}

function NoteForm({onSave}){
  const [text,setText]=useState('');
  return(
    <div>
      <div className="field"><span className="field-label">Note</span><textarea className="text-input" rows={4} placeholder="Write a note..." value={text} onChange={e=>setText(e.target.value)} style={{resize:'none'}}/></div>
      <button className="submit-btn" onClick={()=>onSave({type:'note',startTime:Date.now(),notes:text})}>Save Note</button>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App(){
  const [profiles,setProfiles]=useState(()=>load(STORAGE_KEYS.profiles,DEFAULT_PROFILES));
  const [logs,setLogs]=useState(()=>load(STORAGE_KEYS.logs,DEFAULT_LOGS));
  const [currentProfileId,setCurrentProfileId]=useState(()=>load(STORAGE_KEYS.currentProfile,1));
  const [activeSleep,setActiveSleep]=useState(()=>load(STORAGE_KEYS.activeSleep,null));
  const [activeFeed,setActiveFeed]=useState(()=>load(STORAGE_KEYS.activeFeed,null));
  const [tab,setTab]=useState('timeline');
  const [showSheet,setShowSheet]=useState(false);
  const [sheetStep,setSheetStep]=useState('pick');
  const [logType,setLogType]=useState(null);
  const [showNewProfile,setShowNewProfile]=useState(false);
  const [newProfile,setNewProfile]=useState({name:'',dob:'',color:'sky'});
  const [deferredPrompt,setDeferredPrompt]=useState(null);
  const [showInstall,setShowInstall]=useState(false);

  const sleepSecs=useTimer(activeSleep?.start);
  const feedSecs=useTimer(activeFeed?.start);

  // Persist to localStorage
  useEffect(()=>save(STORAGE_KEYS.profiles,profiles),[profiles]);
  useEffect(()=>save(STORAGE_KEYS.logs,logs),[logs]);
  useEffect(()=>save(STORAGE_KEYS.currentProfile,currentProfileId),[currentProfileId]);
  useEffect(()=>save(STORAGE_KEYS.activeSleep,activeSleep),[activeSleep]);
  useEffect(()=>save(STORAGE_KEYS.activeFeed,activeFeed),[activeFeed]);

  // PWA install prompt
  useEffect(()=>{
    const handler=e=>{e.preventDefault();setDeferredPrompt(e);setShowInstall(true)};
    window.addEventListener('beforeinstallprompt',handler);
    return()=>window.removeEventListener('beforeinstallprompt',handler);
  },[]);

  const profile=profiles.find(p=>p.id===currentProfileId);
  const color=COLORS.find(c=>c.id===(profile?.color||'rose'));
  const profileLogs=logs.filter(l=>l.profileId===currentProfileId).sort((a,b)=>b.startTime-a.startTime);

  const now=Date.now();
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const todayLogs=profileLogs.filter(l=>l.startTime>=todayStart.getTime());
  const lastFeed=profileLogs.find(l=>l.type==='feed');
  const lastSleep=profileLogs.find(l=>l.type==='sleep'&&l.endTime);
  const todaySleepSecs=todayLogs.filter(l=>l.type==='sleep'&&l.duration).reduce((a,l)=>a+l.duration,0);
  const todayDiapers=todayLogs.filter(l=>l.type==='diaper').length;
  const sinceLastFeed=lastFeed?Math.floor((now-lastFeed.startTime)/60000):null;
  const awakeSince=activeSleep?null:(lastSleep?Math.floor((now-lastSleep.endTime)/60000):null);

  function saveLog(data){
    const entry={id:Date.now(),profileId:currentProfileId,...data};
    setLogs(prev=>[entry,...prev]);
    closeSheet();
  }
  function closeSheet(){setShowSheet(false);setSheetStep('pick');setLogType(null)}
  function startSleep(){setActiveSleep({start:Date.now()});closeSheet()}
  function stopSleep(){if(!activeSleep)return;const dur=Math.floor((Date.now()-activeSleep.start)/1000);saveLog({type:'sleep',startTime:activeSleep.start,endTime:Date.now(),duration:dur,quality:'good',notes:''});setActiveSleep(null)}
  function startFeed(ft,side){setActiveFeed({start:Date.now(),feedType:ft||'Breast',side:side||'Left'});closeSheet()}
  function stopFeed(){if(!activeFeed)return;const dur=Math.floor((Date.now()-activeFeed.start)/1000);saveLog({type:'feed',startTime:activeFeed.start,endTime:Date.now(),duration:dur,feedType:activeFeed.feedType,side:activeFeed.side,amount:'',notes:''});setActiveFeed(null)}

  function addProfile(){
    if(!newProfile.name.trim())return;
    const p={id:Date.now(),name:newProfile.name.trim(),dob:newProfile.dob,color:newProfile.color};
    setProfiles(prev=>[...prev,p]);setCurrentProfileId(p.id);setShowNewProfile(false);setNewProfile({name:'',dob:'',color:'sky'});setTab('timeline');
  }

  async function installApp(){
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted')setShowInstall(false);
    setDeferredPrompt(null);
  }

  // ── Render helpers ──
  function renderEntry(l){
    const m=ENTRY_META[l.type]||ENTRY_META.note;
    let detail='';
    if(l.type==='feed')detail=[l.feedType,l.feedType==='Breast'?l.side:null,l.duration?fmtDur(l.duration):null,l.amount?`${l.amount}ml`:null].filter(Boolean).join(' · ');
    else if(l.type==='sleep')detail=[l.duration?fmtDur(l.duration):null,l.quality].filter(Boolean).join(' · ');
    else if(l.type==='diaper')detail=l.diaperType;
    else if(l.type==='pump')detail=[l.side,l.amount?`${l.amount}ml`:null].filter(Boolean).join(' · ');
    return(
      <div key={l.id} className="entry">
        <div className="entry-icon-wrap" style={{background:m.color}}><span style={{fontSize:18}}>{m.icon}</span></div>
        <div className="entry-card">
          <div className="entry-row"><span className="entry-title">{m.label}</span><span className="entry-time">{fmtTime(l.startTime)}</span></div>
          {detail&&<div className="entry-detail">{detail}</div>}
          {l.notes?<div className="entry-detail" style={{fontStyle:'italic',marginTop:4}}>{l.notes}</div>:null}
          <span className="entry-badge" style={{background:m.color,color:m.tc}}>{timeAgo(l.startTime)}</span>
        </div>
      </div>
    );
  }

  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const sleepHrs=days.map((_,i)=>{const dl=logs.filter(l=>{const d=new Date(l.startTime);return d.getDay()===(i+1)%7&&l.type==='sleep'&&l.duration});const h=dl.reduce((a,l)=>a+l.duration/3600,0);return Math.round((h||(3+Math.sin(i*1.7)*1.5))*10)/10});
  const feedCounts=days.map((_,i)=>{const c=logs.filter(l=>{const d=new Date(l.startTime);return d.getDay()===(i+1)%7&&l.type==='feed'}).length;return c||(Math.round(3+Math.sin(i*2.3)*1.5))});
  const maxSleep=Math.max(...sleepHrs,1);
  const maxFeed=Math.max(...feedCounts,1);

  return(
    <div className="app">
      {/* Header */}
      <div className="header">
        <div className="header-top">
          <div className="logo">lullaby<span>.</span></div>
          <div className="profile-row">
            {profiles.map(p=>{const c=COLORS.find(x=>x.id===p.color)||COLORS[0];return(
              <div key={p.id} className="profile-chip" onClick={()=>{setCurrentProfileId(p.id);setTab('timeline')}} style={p.id===currentProfileId?{borderColor:c.dark}:{}}>
                <div className="profile-avatar" style={{background:c.bg,color:c.text}}>{p.name.charAt(0).toUpperCase()}</div>
                {p.id===currentProfileId&&<span className="profile-name">{p.name}</span>}
              </div>
            )})}
            <button className="add-profile-btn" onClick={()=>setTab('profiles')}>+</button>
          </div>
        </div>
        {profile&&<div style={{fontSize:12,color:'var(--muted)',marginLeft:2,marginTop:2}}>{getBabyAge(profile.dob)}</div>}
      </div>

      {/* Install banner */}
      {showInstall&&tab==='timeline'&&(
        <div className="install-banner">
          <span className="install-text">📲 Install Lullaby on your home screen</span>
          <button className="install-btn" onClick={installApp}>Install</button>
          <button className="dismiss-btn" onClick={()=>setShowInstall(false)}>×</button>
        </div>
      )}

      {/* Insights strip */}
      {tab==='timeline'&&(
        <div className="insights-strip">
          {sinceLastFeed!==null&&(
            <div className={`insight-card ${sinceLastFeed>180?'alert':'ok'}`}>
              <div className="insight-label">Last feed</div>
              <div className="insight-value">{sinceLastFeed}m ago</div>
              <div className="insight-sub">{sinceLastFeed>120?'Feed soon!':sinceLastFeed>180?'Overdue!':'On track'}</div>
            </div>
          )}
          {awakeSince!==null&&(
            <div className={`insight-card ${awakeSince>90?'alert':'ok'}`}>
              <div className="insight-label">Awake</div>
              <div className="insight-value">{awakeSince>=60?`${Math.floor(awakeSince/60)}h ${awakeSince%60}m`:`${awakeSince}m`}</div>
              <div className="insight-sub">{awakeSince>90?'Nap time?':'Going well'}</div>
            </div>
          )}
          {activeSleep&&(
            <div className="insight-card ok">
              <div className="insight-label">Sleeping</div>
              <div className="insight-value">{fmtDur(sleepSecs)}</div>
              <div className="insight-sub">In progress</div>
            </div>
          )}
          <div className="insight-card">
            <div className="insight-label">Sleep today</div>
            <div className="insight-value">{todaySleepSecs>0?(todaySleepSecs/3600).toFixed(1)+'h':'—'}</div>
            <div className="insight-sub">total</div>
          </div>
          <div className="insight-card">
            <div className="insight-label">Diapers</div>
            <div className="insight-value">{todayDiapers}</div>
            <div className="insight-sub">today</div>
          </div>
        </div>
      )}

      {/* Tabs */}
      <div className="tabs">
        {[['timeline','Timeline'],['analytics','Analytics'],['profiles','Profiles']].map(([id,label])=>(
          <button key={id} className={`tab ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* Timeline */}
      {tab==='timeline'&&(
        <div className="timeline">
          {(activeSleep||activeFeed)&&(activeSleep?(
            <div className="active-banner sleep">
              <div className="active-info"><span className="active-title">😴 Sleeping now</span><span className="active-timer">{fmtDur(sleepSecs)}</span></div>
              <button className="stop-btn" onClick={stopSleep}>Stop</button>
            </div>
          ):(
            <div className="active-banner feed">
              <div className="active-info"><span className="active-title">🍼 Feeding — {activeFeed.feedType}{activeFeed.feedType==='Breast'?' '+activeFeed.side:''}</span><span className="active-timer">{fmtDur(feedSecs)}</span></div>
              <button className="stop-btn" onClick={stopFeed}>Stop</button>
            </div>
          ))}
          {profileLogs.length===0&&<div className="empty"><div className="empty-icon">🌙</div><div className="empty-text">No logs yet — tap + Log to start</div></div>}
          {groupByDay(profileLogs).map(([day,items])=>(
            <div key={day}><div className="day-label">{day}</div>{items.map(renderEntry)}</div>
          ))}
        </div>
      )}

      {/* Analytics */}
      {tab==='analytics'&&(
        <div className="analytics">
          <div className="section-header">This Week</div>
          <div className="stat-grid">
            <div className="stat-card"><div className="stat-num">{todayDiapers}</div><div className="stat-label">Diapers today</div></div>
            <div className="stat-card"><div className="stat-num">{todayLogs.filter(l=>l.type==='feed').length}</div><div className="stat-label">Feeds today</div></div>
            <div className="stat-card"><div className="stat-num">{todaySleepSecs>0?(todaySleepSecs/3600).toFixed(1)+'h':'—'}</div><div className="stat-label">Sleep today</div></div>
            <div className="stat-card"><div className="stat-num">{profileLogs.length}</div><div className="stat-label">Total logs</div></div>
          </div>
          <div className="bar-chart">
            <div className="bar-chart-title">Sleep hours per day</div>
            <div className="bars">{sleepHrs.map((h,i)=><div className="bar-wrap" key={i}><span className="bar-val">{h}h</span><div className="bar" style={{height:`${(h/maxSleep)*60}px`,background:'#DDD4F0'}}/><span className="bar-day">{days[i]}</span></div>)}</div>
          </div>
          <div className="bar-chart">
            <div className="bar-chart-title">Feeds per day</div>
            <div className="bars">{feedCounts.map((c,i)=><div className="bar-wrap" key={i}><span className="bar-val">{c}</span><div className="bar" style={{height:`${(c/maxFeed)*60}px`,background:'#F2D4CC'}}/><span className="bar-day">{days[i]}</span></div>)}</div>
          </div>
        </div>
      )}

      {/* Profiles */}
      {tab==='profiles'&&(
        <div className="profile-manager">
          <div className="section-header">Profiles</div>
          {profiles.map(p=>{const c=COLORS.find(x=>x.id===p.color)||COLORS[0];return(
            <div key={p.id} className={`profile-card ${p.id===currentProfileId?'current':''}`} onClick={()=>{setCurrentProfileId(p.id);setTab('timeline')}}>
              <div className="profile-info"><div className="profile-big-avatar" style={{background:c.bg,color:c.text}}>{p.name.charAt(0).toUpperCase()}</div><div className="profile-details"><div className="name">{p.name}</div><div className="age">{getBabyAge(p.dob)}</div></div></div>
              {p.id===currentProfileId&&<span style={{fontSize:12,fontWeight:600,color:c.dark}}>Active</span>}
            </div>
          )})}
          {showNewProfile?(
            <div className="new-profile-form">
              <div className="field"><label className="field-label">Baby name</label><input className="text-input" placeholder="e.g. Ayla" value={newProfile.name} onChange={e=>setNewProfile(p=>({...p,name:e.target.value}))}/></div>
              <div className="field"><label className="field-label">Date of birth</label><input className="text-input" type="date" value={newProfile.dob} onChange={e=>setNewProfile(p=>({...p,dob:e.target.value}))}/></div>
              <div className="field"><label className="field-label">Colour</label><div className="color-picker">{COLORS.map(c=><div key={c.id} className={`color-dot ${newProfile.color===c.id?'selected':''}`} style={{background:c.bg}} onClick={()=>setNewProfile(p=>({...p,color:c.id}))}>{newProfile.color===c.id?'✓':''}</div>)}</div></div>
              <div style={{display:'flex',gap:8}}><button className="submit-btn" style={{flex:1}} onClick={addProfile}>Add Baby</button><button className="submit-btn secondary" style={{flex:1}} onClick={()=>setShowNewProfile(false)}>Cancel</button></div>
            </div>
          ):(
            <div className="add-baby-card" onClick={()=>setShowNewProfile(true)}>
              <div style={{width:44,height:44,borderRadius:'50%',border:'1.5px dashed var(--subtle)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,color:'var(--subtle)'}}>+</div>
              <span className="add-baby-text">Add another baby</span>
            </div>
          )}
        </div>
      )}

      {/* FAB */}
      {tab!=='profiles'&&<button className="fab" onClick={()=>{setShowSheet(true);setSheetStep('pick')}}>
        <span style={{fontSize:20,lineHeight:1}}>+</span> Log
      </button>}

      {/* Bottom sheet */}
      {showSheet&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)closeSheet()}}>
          <div className="sheet">
            <div className="sheet-handle"/>
            {sheetStep==='pick'?(
              <>
                <div className="sheet-title">What happened?</div>
                <div className="log-type-grid">
                  {LOG_TYPES.map(t=><button key={t.id} className={`log-type-btn ${logType===t.id?'selected':''}`} onClick={()=>{setLogType(t.id);setSheetStep('form')}}>
                    <span className="log-type-icon">{t.icon}</span><span className="log-type-label">{t.label}</span>
                  </button>)}
                </div>
              </>
            ):(
              <>
                <button className="back-btn" onClick={()=>setSheetStep('pick')}>← Back</button>
                <div className="sheet-title">{LOG_TYPES.find(t=>t.id===logType)?.icon} {LOG_TYPES.find(t=>t.id===logType)?.label}</div>
                {logType==='feed'&&<FeedForm onSave={saveLog} onStartTimer={startFeed}/>}
                {logType==='sleep'&&<SleepForm onSave={saveLog} onStartTimer={startSleep}/>}
                {logType==='diaper'&&<DiaperForm onSave={saveLog}/>}
                {logType==='pump'&&<PumpForm onSave={saveLog}/>}
                {logType==='note'&&<NoteForm onSave={saveLog}/>}
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(r=>console.log('SW registered')).catch(e=>console.log('SW error',e));
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#FBF8F5"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Lullaby"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Lullaby — Baby Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
/* ── LIGHT ── */
:root{
  --bg:#FBF8F5;--bg2:#F2EDE8;--bg3:#E8E2DC;
  --card:#FFFFFF;--border:#E4DCD4;
  --ink:#2C1A0E;--muted:#8C7060;--subtle:#B0A090;
  --shadow:0 2px 12px rgba(44,26,14,0.06);
  --shadow-lg:0 8px 32px rgba(44,26,14,0.12);
  --danger:#E85A4F;--danger-bg:#FDECEA;
  --success:#3A9060;--success-bg:#C8EAD8;
  --accent:#C4705A;--accent-bg:#F2D4CC;--accent-text:#7A3020;
  --accent2:#3A9060;--accent2-bg:#C8EAD8;--accent2-text:#1A5030;
  --lav:#DDD4F0;--lav-deep:#7060B8;--lav-text:#3A2878;
  --ai:#F5E4BC;--ai-deep:#C08030;--ai-text:#6A4010;
}
/* ── DARK ── */
body.dark{
  --bg:#1A1210;--bg2:#231815;--bg3:#2E201C;
  --card:#2A1E1A;--border:#3D2D28;
  --ink:#F5EDE8;--muted:#9A8070;--subtle:#6A5548;
  --shadow:0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.4);
}
/* ── GENDER THEMES ── */
body.theme-girl{ --accent:#C4705A;--accent-bg:#F2D4CC;--accent-text:#7A3020;--lav:#F5C8E0;--lav-deep:#C050A0;--lav-text:#6A1848; }
body.dark.theme-girl{ --accent:#E89080;--accent-bg:#4A2820;--accent-text:#F5C0B0;--lav:#3A1828;--lav-deep:#D070A0;--lav-text:#F0B0D0; }
body.theme-boy{ --accent:#4A80B8;--accent-bg:#C8DCF0;--accent-text:#1A3D6B;--lav:#C8DCF0;--lav-deep:#4A80B8;--lav-text:#1A3D6B; }
body.dark.theme-boy{ --accent:#6AA0D8;--accent-bg:#1A3050;--accent-text:#B0D0F0;--lav:#1A3050;--lav-deep:#6AA0D8;--lav-text:#B0D0F0; }

body{background:var(--bg);color:var(--ink)}
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}

/* ── Header ── */
.header{padding:16px 20px 10px;position:sticky;top:0;z-index:40;background:var(--bg)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink)}
.logo span{color:var(--accent);font-style:italic}
.profile-row{display:flex;gap:7px;align-items:center}
.profile-chip{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;background:var(--card);border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:all .15s}
.profile-chip.active-chip{border-color:var(--accent)}
.p-avatar-sm{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;overflow:hidden;flex-shrink:0;background:var(--accent-bg);color:var(--accent-text)}
.p-avatar-sm img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:12px;font-weight:500;color:var(--ink)}
.add-profile-btn{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--subtle);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--subtle);font-size:16px;transition:all .15s}
.add-profile-btn:hover{border-color:var(--accent);color:var(--accent)}
.user-btn{width:30px;height:30px;border-radius:50%;overflow:hidden;cursor:pointer;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg2);font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0;transition:border-color .15s}
.user-btn:hover{border-color:var(--accent)}
.user-btn img{width:100%;height:100%;object-fit:cover}
.ai-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ai-deep);background:var(--ai);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;flex-shrink:0}
.ai-btn:hover{transform:scale(1.1)}

/* ── Notif badge ── */
.notif-dot{position:relative}
.notif-dot::after{content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:1.5px solid var(--bg)}

/* ── Tabs ── */
.tabs{display:flex;padding:0 20px;gap:3px;margin-bottom:8px}
.tab{flex:1;padding:7px 4px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);border-radius:10px;cursor:pointer;transition:all .15s}
.tab.active{background:var(--ink);color:var(--bg)}

/* ── Insights ── */
.insights-strip{padding:0 20px 14px;overflow-x:auto;display:flex;gap:10px;scrollbar-width:none}
.insights-strip::-webkit-scrollbar{display:none}
.insight-card{min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);flex-shrink:0}
.insight-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.insight-value{font-size:17px;font-weight:600;color:var(--ink)}
.insight-sub{font-size:10px;color:var(--muted);margin-top:2px}
.insight-card.alert .insight-value{color:var(--danger)}
.insight-card.ok .insight-value{color:var(--accent2)}

/* ── AI Insight Banner ── */
.ai-insight{margin:0 20px 14px;padding:12px 14px;background:var(--ai);border:1px solid var(--ai-deep);border-radius:14px;cursor:pointer}
.ai-insight-row{display:flex;align-items:flex-start;gap:8px}
.ai-insight-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.ai-insight-text{font-size:13px;color:var(--ai-text);line-height:1.5;flex:1}
.ai-insight-label{font-size:10px;font-weight:600;color:var(--ai-deep);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}

/* ── Active banner ── */
.active-banner{margin:0 20px 14px;padding:13px 15px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;animation:pulse 2s infinite}
.active-banner.sleep{background:var(--lav);border:1px solid var(--lav-deep)}
.active-banner.feed{background:var(--accent-bg);border:1px solid var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.88}}
.active-info{display:flex;flex-direction:column;gap:2px}
.active-title{font-size:12px;font-weight:600;color:var(--lav-text)}
.active-timer{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--lav-text)}
.active-banner.feed .active-title,.active-banner.feed .active-timer{color:var(--accent-text)}
.stop-btn{padding:8px 16px;border-radius:100px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.active-banner.sleep .stop-btn{background:var(--lav-deep);color:#fff}
.active-banner.feed .stop-btn{background:var(--accent);color:#fff}

/* ── Timeline ── */
.timeline{padding:0 20px;padding-bottom:120px}
.day-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 9px;padding-left:4px}
.entry{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}
.entry-icon-wrap{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;margin-top:2px}
.entry-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow)}
.entry-row{display:flex;justify-content:space-between;align-items:center}
.entry-title{font-size:13px;font-weight:600;color:var(--ink)}
.entry-time{font-size:11px;color:var(--muted)}
.entry-detail{font-size:11px;color:var(--muted);margin-top:2px}
.entry-badge-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.entry-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:100px;display:inline-block}
.partial-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px;background:var(--ai);color:var(--ai-text);margin-left:4px}
.entry-actions{display:flex;gap:4px}
.icon-action-btn{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;color:var(--muted)}
.icon-action-btn:hover{background:var(--bg2);border-color:var(--accent);color:var(--accent)}
.icon-action-btn.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── Empty ── */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:10px;opacity:.5}
.empty-text{font-size:14px}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border:none;border-radius:100px;padding:15px 30px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;z-index:50;transition:all .15s}
.fab:hover{transform:translateX(-50%) scale(1.03)}
.fab:active{transform:translateX(-50%) scale(.97)}

/* ── Sheet ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:12px 20px calc(40px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:100px;margin:0 auto 18px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);margin-bottom:18px}
.log-type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:8px}
.log-type-btn{padding:14px 8px;border-radius:14px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s}
.log-type-btn:hover{border-color:var(--accent);transform:scale(1.02)}
.log-type-icon{font-size:24px}
.log-type-label{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:var(--ink)}

/* ── Form elements ── */
.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:block}
.field-row{display:flex;gap:7px;flex-wrap:wrap}
.chip-btn{padding:7px 13px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .12s}
.chip-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-btn.partial-active{background:var(--ai);color:var(--ai-text);border-color:var(--ai-deep)}
.text-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:11px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:border .15s}
.text-input:focus{border-color:var(--accent)}
.number-input{width:100px;padding:10px 13px;border:1.5px solid var(--border);border-radius:11px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--bg);outline:none}
.submit-btn{width:100%;padding:13px;background:var(--ink);color:var(--bg);border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s}
.submit-btn:hover{opacity:.9}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-btn.secondary{background:var(--bg2);color:var(--ink);border:1px solid var(--border)}
.submit-btn.danger{background:var(--danger);color:#fff}
.submit-btn.success{background:var(--success);color:#fff}
.back-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:10px;padding:0;font-family:'DM Sans',sans-serif}
.section-divider{height:1px;background:var(--border);margin:14px 0}
.confirm-row{display:flex;gap:8px;margin-top:8px}
.time-box{background:var(--bg2);border:1.5px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:14px}
.time-box-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── Analytics ── */
.analytics{padding:0 20px 120px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:600;color:var(--ink)}
.stat-label{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.bar-chart{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:9px}
.bar-chart-title{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{width:100%;border-radius:5px 5px 0 0;min-height:3px}
.bar-day{font-size:9px;color:var(--muted);font-weight:500}
.bar-val{font-size:9px;color:var(--muted)}

/* ── Profiles ── */
.profile-manager{padding:20px;padding-bottom:120px}
.section-header{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);margin-bottom:14px}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.profile-card.current{border-color:var(--accent)}
.profile-info{display:flex;align-items:center;gap:11px;cursor:pointer;flex:1}
.profile-big-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;flex-shrink:0}
.p-name{font-size:14px;font-weight:600;color:var(--ink)}
.p-age{font-size:11px;color:var(--muted);margin-top:2px}
.add-baby-card{background:transparent;border:1.5px dashed var(--subtle);border-radius:14px;padding:14px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:all .15s}
.add-baby-card:hover{border-color:var(--accent)}
.color-picker{display:flex;gap:7px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.color-dot.selected{border-color:var(--ink)}
.small-btn{padding:5px 11px;border-radius:100px;border:1px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .12s}
.small-btn:hover{border-color:var(--accent);color:var(--accent)}
.gender-row{display:flex;gap:7px}
.gender-chip{flex:1;padding:9px;border-radius:11px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink);text-align:center;transition:all .15s}
.gender-chip.girl.active{background:#F2D4CC;border-color:#C4705A;color:#7A3020}
.gender-chip.boy.active{background:#C8DCF0;border-color:#4A80B8;color:#1A3D6B}
.gender-chip.neutral.active{background:var(--bg2);border-color:var(--ink)}

/* ── Partner ── */
.partner-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}
.partner-avatar-row{display:flex;gap:-6px;margin-bottom:10px}
.partner-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-bg);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border:2px solid var(--card)}
.partner-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--success-bg);border:1px solid var(--success);border-radius:100px;font-size:12px;font-weight:500;color:var(--accent2-text)}

/* ── Settings ── */
.settings-page{padding:20px;padding-bottom:120px}
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;font-weight:500;color:var(--ink)}
.settings-row-sub{font-size:11px;color:var(--muted);margin-top:2px}
.settings-section-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:14px 16px 6px;border-bottom:1px solid var(--border)}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:100px;background:var(--border);transition:.3s;cursor:pointer}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:white;transition:.3s;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle input:checked~.toggle-thumb{left:20px}
.api-key-row{display:flex;gap:8px;align-items:center}

/* ── AI Chat Sheet ── */
.ai-messages{max-height:340px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.ai-msg{padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.55;max-width:92%}
.ai-msg.user{background:var(--ink);color:var(--bg);align-self:flex-end}
.ai-msg.assistant{background:var(--bg2);color:var(--ink);align-self:flex-start;border:1px solid var(--border)}
.ai-msg.loading{opacity:.6}
.ai-input-row{display:flex;gap:8px}
.ai-send-btn{padding:10px 16px;background:var(--ink);color:var(--bg);border:none;border-radius:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}

/* ── Notifications ── */
.notif-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:9px}
.notif-card-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.notif-card-sub{font-size:11px;color:var(--muted)}
.notif-perm-banner{padding:12px 14px;background:var(--ai);border:1px solid var(--ai-deep);border-radius:12px;margin-bottom:12px;font-size:13px;color:var(--ai-text)}

/* ── Auth ── */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.auth-logo{font-family:'DM Serif Display',serif;font-size:40px;color:var(--ink);margin-bottom:6px;text-align:center}
.auth-logo span{color:var(--accent);font-style:italic}
.auth-tagline{font-size:15px;color:var(--muted);margin-bottom:40px;text-align:center}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 22px;width:100%;max-width:360px;box-shadow:var(--shadow-lg)}
.auth-title{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:18px}
.auth-or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--subtle);font-size:12px}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{width:100%;padding:12px;background:var(--card);color:var(--ink);border:1.5px solid var(--border);border-radius:13px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s}
.google-btn:hover{border-color:var(--accent)}
.google-icon{width:18px;height:18px;flex-shrink:0}

// ── Helpers ────────────────────────────────────────────────────
const fmtDur=s=>{if(!s&&s!==0)return'—';const m=Math.floor(s/60),r=s%60;if(m>=60)return`${Math.floor(m/60)}h ${m%60}m`;return`${m}m ${r<10?'0'+r:r}s`};
const fmtTime=ts=>{const d=new Date(ts);let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'pm':'am';h=h%12||12;return`${h}:${m<10?'0'+m:m} ${ap}`};
const timeAgo=ts=>{const d=Math.floor((Date.now()-ts)/1000);if(d<60)return'just now';if(d<3600)return`${Math.floor(d/60)}m ago`;if(d<86400)return`${Math.floor(d/3600)}h ${Math.floor((d%3600)/60)}m ago`;return`${Math.floor(d/86400)}d ago`};
const dayLabel=ts=>{const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return'Today';const y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})};
const getBabyAge=dob=>{if(!dob)return'';const days=Math.floor((Date.now()-new Date(dob))/86400000);if(days<30)return`${days}d old`;if(days<365)return`${Math.floor(days/30)}mo old`;return`${Math.floor(days/365)}y ${Math.floor((days%365)/30)}mo old`};
const groupByDay=items=>{const g={};items.forEach(l=>{const k=dayLabel(l.start_time);if(!g[k])g[k]=[];g[k].push(l)});return Object.entries(g)};
const lsGet=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const tsToLocal=ts=>{const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const localToTs=s=>new Date(s).getTime();
const nowLocal=()=>tsToLocal(Date.now());

// ── Timer ──────────────────────────────────────────────────────
function useTimer(startTs){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{if(!startTs)return;const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[startTs]);
  return startTs?Math.floor((now-startTs)/1000):0;
}

// ── Push Notifications ─────────────────────────────────────────
async function requestNotifPermission(){
  if(!('Notification' in window))return 'unsupported';
  if(Notification.permission==='granted')return 'granted';
  const result=await Notification.requestPermission();
  return result;
}
function scheduleLocalNotif(title,body,delayMs){
  if(Notification.permission!=='granted')return;
  setTimeout(()=>new Notification(title,{body,icon:'/icons/icon-192.png',badge:'/icons/icon-192.png'}),delayMs);
}

// ── AI helpers ─────────────────────────────────────────────────
function buildContext(logs,profiles,pid){
  const p=profiles.find(x=>x.id===pid);
  if(!p)return'No baby profile selected.';
  const age=getBabyAge(p.dob);
  const recent=logs.slice(0,30);
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const today=logs.filter(l=>l.start_time>=todayStart.getTime());
  const lastFeed=logs.find(l=>l.type==='feed');
  const lastSleep=logs.find(l=>l.type==='sleep'&&l.end_time);
  const todayFeeds=today.filter(l=>l.type==='feed').length;
  const todayDiapers=today.filter(l=>l.type==='diaper').length;
  const todaySleep=today.filter(l=>l.type==='sleep'&&l.duration).reduce((a,l)=>a+l.duration,0);
  return `Baby: ${p.name}, ${age}. Today: ${todayFeeds} feeds, ${todayDiapers} diapers, ${Math.round(todaySleep/3600*10)/10}h sleep. Last feed: ${lastFeed?timeAgo(lastFeed.start_time):'none'}. Last sleep end: ${lastSleep?timeAgo(lastSleep.end_time):'none'}. Recent logs (last 30): ${JSON.stringify(recent.map(l=>({type:l.type,time:fmtTime(l.start_time),dur:l.duration?fmtDur(l.duration):null,feedType:l.feed_type,partial:l.is_partial,diaperType:l.diaper_type,quality:l.quality})))}`;
}

async function callClaude(apiKey,systemPrompt,messages){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-4-20250514',max_tokens:600,system:systemPrompt,messages})
  });
  if(!res.ok)throw new Error(`API error ${res.status}`);
  const data=await res.json();
  return data.content?.[0]?.text||'No response';
}

function AuthScreen(){
  const [mode,setMode]=useState('login');
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [loading,setLoading]=useState(false);
  const [googleLoading,setGoogleLoading]=useState(false);
  const [msg,setMsg]=useState({text:'',type:''});
  async function handleEmail(){
    if(!email||!password)return;
    setLoading(true);setMsg({text:'',type:''});
    const{error}=await(mode==='login'?sb.auth.signInWithPassword({email,password}):sb.auth.signUp({email,password}));
    setLoading(false);
    if(error){setMsg({text:error.message,type:'error'});return;}
    if(mode==='signup')setMsg({text:'Check your email to confirm, then log in.',type:'info'});
  }
  async function handleGoogle(){
    setGoogleLoading(true);
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://lullaby.skofi.tech'}});
    if(error){setMsg({text:error.message,type:'error'});setGoogleLoading(false);}
  }
  return(
    <div className="auth-screen">
      <div className="auth-logo">lullaby<span>.</span></div>
      <div className="auth-tagline">Track every moment with love 🌙</div>
      <div className="auth-card">
        <div className="auth-title">{mode==='login'?'Welcome back':'Create account'}</div>
        <button className="google-btn" onClick={handleGoogle} disabled={googleLoading}>{googleLoading?<span className="spinner dark"/>:<GoogleIcon/>}{googleLoading?'Redirecting…':'Continue with Google'}</button>
        <div className="auth-or">or</div>
        <div className="field"><label className="field-label">Email</label><input className="text-input" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEmail()}/></div>
        <div className="field"><label className="field-label">Password</label><input className="text-input" type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEmail()}/></div>
        {msg.text&&<div className={`auth-msg ${msg.type}`}>{msg.text}</div>}
        <button className="submit-btn" onClick={handleEmail} disabled={loading}>{loading?<span className="spinner"/>:mode==='login'?'Log in':'Sign up'}</button>
        <div className="auth-toggle">{mode==='login'?<>No account? <span onClick={()=>{setMode('signup');setMsg({text:'',type:''})}}>Sign up</span></>:<>Have an account? <span onClick={()=>{setMode('login');setMsg({text:'',type:''})}}>Log in</span></>}</div>
      </div>
    </div>
  );
}

function EditLogSheet({log,onSave,onDelete,onClose}){
  const m=ENTRY_META[log.type]||ENTRY_META.note;
  const [startStr,setStartStr]=useState(tsToLocal(log.start_time));
  const [endStr,setEndStr]=useState(log.end_time?tsToLocal(log.end_time):'');
  const [feedType,setFeedType]=useState(log.feed_type||'Breast');
  const [side,setSide]=useState(log.side||'Left');
  const [amount,setAmount]=useState(log.amount||'');
  const [diaperType,setDiaperType]=useState(log.diaper_type||'Pee');
  const [quality,setQuality]=useState(log.quality||'good');
  const [notes,setNotes]=useState(log.notes||'');
  const [isPartial,setIsPartial]=useState(!!log.is_partial);
  const [confirmDelete,setConfirmDelete]=useState(false);
  const [saving,setSaving]=useState(false);

  async function handleSave(){
    setSaving(true);
    const st=localToTs(startStr);const et=endStr?localToTs(endStr):null;
    const dur=et&&st?Math.max(0,Math.floor((et-st)/1000)):log.duration;
    await onSave(log.id,{start_time:st,end_time:et,duration:dur,
      feed_type:log.type==='feed'?feedType:log.feed_type,
      side:(log.type==='feed'||log.type==='pump')?side:log.side,
      amount:(log.type==='feed'||log.type==='pump')?amount:log.amount,
      diaper_type:log.type==='diaper'?diaperType:log.diaper_type,
      quality:log.type==='sleep'?quality:log.quality,
      notes,is_partial:log.type==='feed'?isPartial:log.is_partial});
    setSaving(false);
  }
  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="sheet">
        <div className="sheet-handle"/>
        <button className="back-btn" onClick={onClose}>← Back</button>
        <div className="sheet-title">{m.icon} Edit {m.label}</div>
        <div className="field"><span className="field-label">Start time</span><input className="text-input" type="datetime-local" value={startStr} onChange={e=>setStartStr(e.target.value)}/></div>
        {(log.type==='feed'||log.type==='sleep'||log.type==='pump')&&<div className="field"><span className="field-label">End time</span><input className="text-input" type="datetime-local" value={endStr} onChange={e=>setEndStr(e.target.value)}/>{endStr&&startStr&&<div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>Duration: {fmtDur(Math.max(0,Math.floor((localToTs(endStr)-localToTs(startStr))/1000)))}</div>}</div>}
        {log.type==='feed'&&<><div className="field"><span className="field-label">Type</span><div className="field-row">{['Breast','Bottle','Solid'].map(t=><button key={t} className={`chip-btn ${feedType===t?'active':''}`} onClick={()=>setFeedType(t)}>{t}</button>)}</div></div>
        {feedType==='Breast'&&<div className="field"><span className="field-label">Side</span><div className="field-row">{['Left','Right','Both'].map(s=><button key={s} className={`chip-btn ${side===s?'active':''}`} onClick={()=>setSide(s)}>{s}</button>)}</div></div>}
        {feedType==='Bottle'&&<div className="field"><span className="field-label">Amount (ml)</span><input className="number-input" type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div>}
        <div className="field"><span className="field-label">Completeness</span><div className="field-row">
          <button className={`chip-btn ${!isPartial?'active':''}`} onClick={()=>setIsPartial(false)}>✅ Full feed</button>
          <button className={`chip-btn ${isPartial?'partial-active':''}`} onClick={()=>setIsPartial(true)}>⚡ Partial</button>
        </div></div></>}
        {log.type==='sleep'&&<div className="field"><span className="field-label">Quality</span><div className="field-row">{['good','ok','rough'].map(q=><button key={q} className={`chip-btn ${quality===q?'active':''}`} onClick={()=>setQuality(q)}>{q}</button>)}</div></div>}
        {log.type==='diaper'&&<div className="field"><span className="field-label">Type</span><div className="field-row">{['Pee','Poop','Both'].map(t=><button key={t} className={`chip-btn ${diaperType===t?'active':''}`} onClick={()=>setDiaperType(t)}>{t}</button>)}</div></div>}
        <div className="field"><span className="field-label">Notes</span><textarea className="text-input" rows={3} style={{resize:'none'}} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional..."/></div>
        <button className="submit-btn" onClick={handleSave} disabled={saving}>{saving?<span className="spinner"/>:'Save changes'}</button>
        <div className="section-divider"/>
        {!confirmDelete?<button className="submit-btn danger" onClick={()=>setConfirmDelete(true)}>Delete this log</button>
        :<div><div style={{fontSize:13,color:'var(--muted)',marginBottom:10,textAlign:'center'}}>Are you sure? This cannot be undone.</div>
        <div className="confirm-row"><button className="submit-btn danger" style={{flex:1}} onClick={()=>onDelete(log.id)}>Yes, delete</button><button className="submit-btn secondary" style={{flex:1,marginTop:0}} onClick={()=>setConfirmDelete(false)}>Cancel</button></div></div>}
      </div>
    </div>
  );
}

// ── AI Chat Sheet ──────────────────────────────────────────────
function AIChatSheet({onClose,apiKey,logs,profiles,pid}){
  const [messages,setMessages]=useState([{role:'assistant',content:`Hi! I'm your baby care advisor. Ask me anything about ${profiles.find(p=>p.id===pid)?.name||'your baby'}'s routine, feeding, sleep, or development.`}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'})},[messages]);

  async function send(){
    if(!input.trim()||loading)return;
    if(!apiKey){setMessages(m=>[...m,{role:'assistant',content:'Please add your Claude API key in Settings first.'}]);setInput('');return;}
    const userMsg={role:'user',content:input};
    setMessages(m=>[...m,userMsg]);setInput('');setLoading(true);
    try{
      const context=buildContext(logs,profiles,pid);
      const systemPrompt=`You are a knowledgeable, warm baby care advisor. Here is the current baby data:\n\n${context}\n\nGive practical, evidence-based advice. Be concise (2-4 sentences). If something sounds medically urgent, recommend consulting a doctor.`;
      const history=messages.filter(m=>m.role!=='assistant'||messages.indexOf(m)>0).concat(userMsg);
      const reply=await callClaude(apiKey,systemPrompt,history.map(m=>({role:m.role,content:m.content})));
      setMessages(m=>[...m,{role:'assistant',content:reply}]);
    }catch(e){setMessages(m=>[...m,{role:'assistant',content:`Error: ${e.message}. Check your API key in Settings.`}]);}
    setLoading(false);
  }

  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="sheet">
        <div className="sheet-handle"/>
        <button className="back-btn" onClick={onClose}>← Back</button>
        <div className="sheet-title">💡 AI Baby Advisor</div>
        <div className="ai-messages">
          {messages.map((m,i)=><div key={i} className={`ai-msg ${m.role}`}>{m.content}</div>)}
          {loading&&<div className="ai-msg assistant loading">Thinking...</div>}
          <div ref={bottomRef}/>
        </div>
        <div className="ai-input-row">
          <input className="text-input" style={{flex:1,margin:0}} placeholder="Ask about sleep, feeding, development..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/>
          <button className="ai-send-btn" onClick={send} disabled={loading}>Send</button>
        </div>
      </div>
    </div>
  );
}

        <div key={item.key} className="notif-card">

          </div>

            <div style={{display:'flex',alignItems:'center',gap:10,marginTop:8}}>
              <span style={{fontSize:12,color:'var(--muted)'}}>Every</span>
              <select className="text-input" style={{width:'auto',padding:'6px 10px'}}

function PartnerTab({session,pid,profiles}){
  const [partnerEmail,setPartnerEmail]=useState('');
  const [partners,setPartners]=useState([]);
  const [loading,setLoading]=useState(false);
  const [shareCode,setShareCode]=useState('');
  const [joinCode,setJoinCode]=useState('');
  const [msg,setMsg]=useState('');
  const profile=profiles.find(p=>p.id===pid);

  useEffect(()=>{if(pid)loadPartners();},[pid]);

  async function loadPartners(){
    const{data}=await sb.from('profile_partners').select('*').eq('profile_id',pid);
    setPartners(data||[]);
    // Generate share code from profile id
    setShareCode(pid?pid.slice(0,8).toUpperCase():'');
  }

  async function invitePartner(){
    if(!partnerEmail.trim())return;
    setLoading(true);
    const{error}=await sb.from('profile_partners').insert({profile_id:pid,invited_email:partnerEmail.trim(),invited_by:session.user.id});
    setLoading(false);
    if(error){setMsg('Failed to invite. They may already have access.');return;}
    setMsg(`Invite sent to ${partnerEmail}! They need to sign up with that email.`);
    setPartnerEmail('');
    loadPartners();
  }

  async function joinByCode(){
    if(!joinCode.trim())return;
    setLoading(true);
    const profileId=joinCode.trim().toLowerCase();
    // Find profile where id starts with the code
    const{data:profiles2}=await sb.from('profiles').select('id,name').ilike('id',`${joinCode.trim()}%`);
    if(!profiles2||profiles2.length===0){setMsg('Profile not found. Check the code.');setLoading(false);return;}
    const targetProfile=profiles2[0];
    const{error}=await sb.from('profile_partners').insert({profile_id:targetProfile.id,invited_email:session.user.email,invited_by:null,accepted:true});
    setLoading(false);
    if(error){setMsg('Could not join. You may already have access.');return;}
    setMsg(`Joined ${targetProfile.name}'s profile!`);
    setJoinCode('');
  }

  async function removePartner(id){
    await sb.from('profile_partners').delete().eq('id',id);
    loadPartners();
  }

  return(
    <div style={{padding:'0 20px',paddingBottom:120}}>
      <div className="section-header" style={{marginTop:4}}>Partner Sharing</div>

      {/* Share code */}
      {profile&&<div className="partner-section">
        <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Your share code for {profile.name}</div>
        <div style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>Share this code with your partner so they can join and view all logs</div>
        <div style={{background:'var(--bg2)',borderRadius:10,padding:'12px 16px',textAlign:'center',letterSpacing:3,fontSize:22,fontWeight:700,color:'var(--accent)',border:'1.5px dashed var(--accent)',marginBottom:10}}>{shareCode}</div>
        <button className="submit-btn secondary" onClick={()=>{navigator.clipboard.writeText(shareCode);setMsg('Code copied!')}}>Copy code</button>
      </div>}

      {/* Current partners */}
      {partners.length>0&&<div className="partner-section" style={{marginBottom:10}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>People with access</div>
        {partners.map(p=>(
          <div key={p.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{width:32,height:32,borderRadius:'50%',background:'var(--accent-bg)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:600,fontSize:13,color:'var(--accent-text)'}}>{(p.invited_email||'?').charAt(0).toUpperCase()}</div>
              <div>
                <div style={{fontSize:13,fontWeight:500}}>{p.invited_email}</div>
                <div style={{fontSize:11,color:'var(--muted)'}}>{p.accepted?'✓ Active':'Pending invite'}</div>
              </div>
            </div>
            <button className="small-btn" style={{color:'var(--danger)'}} onClick={()=>removePartner(p.id)}>Remove</button>
          </div>
        ))}
      </div>}

      {/* Invite form */}
      <div className="partner-section" style={{marginBottom:10}}>
        <div style={{fontWeight:600,fontSize:13,marginBottom:4}}>Invite by email</div>
        <div style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>They need to sign up to Lullaby with this email</div>
        <div className="field"><input className="text-input" type="email" placeholder="partner@example.com" value={partnerEmail} onChange={e=>setPartnerEmail(e.target.value)}/></div>
        <button className="submit-btn" onClick={invitePartner} disabled={loading}>{loading?<span className="spinner"/>:'Send invite'}</button>
      </div>

      {/* Join by code */}
      <div className="partner-section">

  );

  const [showNewP,setShowNewP]           = useState(false);
  const [editingProfile,setEditingProfile] = useState(null);
  const [newP,setNewP]                   = useState({name:'',dob:'',color:'rose',gender:'neutral'});
  const [toast,setToast]                 = useState('');
  const [saving,setSaving]               = useState(false);
  const [darkMode,setDarkMode]           = useState(()=>lsGet('lul_dark',false));
  const [apiKey,setApiKey]               = useState(()=>lsGet('lul_apikey',''));
  const [showAI,setShowAI]               = useState(false);
  const [aiInsight,setAiInsight]         = useState('');
  const [notifSettings,setNotifSettings] = useState(()=>lsGet('lul_notif',{}));

  const sleepSecs=useTimer(activeSleep?.start);
  const feedSecs =useTimer(activeFeed?.start);

  // Apply theme — using ref to avoid re-render loop
  const themeRef = useRef({darkMode, pid, profiles});
  useEffect(()=>{
    themeRef.current = {darkMode, pid, profiles};
    const b=document.body;
    b.classList.toggle('dark',darkMode);
    b.classList.remove('theme-girl','theme-boy','theme-neutral');
    const p=profiles.find(x=>x.id===pid);
    const g=p?.gender||'neutral';
    b.classList.add(g==='girl'?'theme-girl':g==='boy'?'theme-boy':'theme-neutral');
  },[darkMode,pid,profiles]);

  useEffect(()=>{lsSet('lul_sleep',activeSleep)},[activeSleep]);
  useEffect(()=>{lsSet('lul_feed',activeFeed)},[activeFeed]);

  function showToast(m){setToast(m);setTimeout(()=>setToast(''),2500)}

  // Auth
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{setSession(session);setAuthReady(true)});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{setSession(s);setAuthReady(true)});
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session){setProfiles([]);setLogs([]);setPid(null);return;}
    loadProfiles();
  },[session?.user?.id]); // ← key fix: only re-run when user ID changes, not on every session update

  async function loadProfiles(){
    const{data,error}=await sb.from('profiles').select('*').order('created_at');
    if(error||!data){console.error('Profile load error',error);return;}
    setProfiles(data);
    const saved=lsGet('lul_pid',null);
    const match=data.find(p=>p.id===saved);
    setPid(match?match.id:data[0]?.id||null);
  }

  // ← Key fix: separate useEffect, only fires when pid actually changes
  const loadingRef=useRef(false);
  useEffect(()=>{
    if(!pid||loadingRef.current)return;
    lsSet('lul_pid',pid);
    loadingRef.current=true;
    loadLogs(pid).finally(()=>{loadingRef.current=false});
  },[pid]);

  async function loadLogs(profileId){
    const{data,error}=await sb.from('logs').select('*')
      .eq('profile_id',profileId)
      .order('start_time',{ascending:false})
      .limit(500);
    if(error){console.error('Log load error',error);return;}
    console.log(`Loaded ${data?.length||0} logs for profile ${profileId}`);
    setLogs(data||[]);
  }

  // Generate AI insight when logs change
  useEffect(()=>{
    if(!apiKey||logs.length<5)return;
    const timer=setTimeout(async()=>{
      try{
        const ctx=buildContext(logs,profiles,pid);
        const insight=await callClaude(apiKey,
          `You are a baby care advisor. Based on this data, give ONE short (1-2 sentence) actionable insight or observation. Be warm and specific. Data: ${ctx}`,
          [{role:'user',content:'Give me one key insight about the current patterns.'}]);
        setAiInsight(insight);
      }catch(e){/* silent fail */}
    },3000);
    return()=>clearTimeout(timer);
  },[logs.length,apiKey]);

  // Notification scheduling
  useEffect(()=>{
    if(Notification?.permission!=='granted')return;
    const intervals=[];
    if(notifSettings.feedReminder){
      const hrs=notifSettings.feedIntervalHrs||3;
      const id=setInterval(()=>{
        const last=logs.find(l=>l.type==='feed');
        if(!last)return;
        const minsAgo=Math.floor((Date.now()-last.start_time)/60000);
        if(minsAgo>=hrs*60)scheduleLocalNotif('🍼 Feed time!',`${profiles.find(p=>p.id===pid)?.name||'Baby'} may be ready for a feed`,100);
      },60000);
      intervals.push(id);
    }
    if(notifSettings.diaperReminder){
      const hrs=notifSettings.diaperIntervalHrs||4;
      const id=setInterval(()=>{
        const last=logs.find(l=>l.type==='diaper');
        if(!last)return;
        const minsAgo=Math.floor((Date.now()-last.start_time)/60000);
        if(minsAgo>=hrs*60)scheduleLocalNotif('🧷 Diaper check',`It's been ${hrs} hours since the last diaper change`,100);
      },60000);
      intervals.push(id);
    }
    return()=>intervals.forEach(clearInterval);
  },[notifSettings,logs,pid,profiles]);

  // ── CRUD ──
  async function saveLog(data){
    setSaving(true);
    const row={
      profile_id:pid,user_id:session.user.id,
      type:data.type,
      start_time:data.start_time||Date.now(),
      end_time:data.end_time||null,
      duration:data.duration||null,
      feed_type:data.feed_type||null,
      side:data.side||null,
      amount:data.amount||null,
      diaper_type:data.diaper_type||null,
      quality:data.quality||null,
      notes:data.notes||null,
      is_partial:data.is_partial||false,
    };
    const{data:saved,error}=await sb.from('logs').insert(row).select().single();
    setSaving(false);
    if(error){console.error('Save error',error);showToast('❌ Save failed — check connection');return;}
    setLogs(prev=>[saved,...prev].sort((a,b)=>b.start_time-a.start_time));
    showToast(`${ENTRY_META[data.type]?.icon} Saved!`);
    closeSheet();
  }

  async function updateLog(id,updates){
    const{data:updated,error}=await sb.from('logs').update(updates).eq('id',id).select().single();
    if(error){showToast('❌ Update failed');return;}
    setLogs(prev=>prev.map(l=>l.id===id?updated:l));
    setEditingLog(null);showToast('✏️ Updated');
  }

  async function deleteLog(id){
    const{error}=await sb.from('logs').delete().eq('id',id);
    if(error){showToast('❌ Delete failed');return;}
    setLogs(prev=>prev.filter(l=>l.id!==id));
    setEditingLog(null);showToast('🗑️ Deleted');
  }

  async function addProfile(){
    if(!newP.name.trim())return;
    const{data,error}=await sb.from('profiles').insert({user_id:session.user.id,name:newP.name.trim(),dob:newP.dob||null,color:newP.color,gender:newP.gender}).select().single();
    if(error){showToast('❌ Failed');return;}
    setProfiles(prev=>[...prev,data]);setPid(data.id);setShowNewP(false);setNewP({name:'',dob:'',color:'rose',gender:'neutral'});setTab('timeline');showToast(`🎉 ${data.name} added!`);
  }

  async function updateProfile(id,updates){
    const{data:updated,error}=await sb.from('profiles').update(updates).eq('id',id).select().single();
    if(error){showToast('❌ Failed');return;}
    setProfiles(prev=>prev.map(p=>p.id===id?updated:p));setEditingProfile(null);showToast('✏️ Updated');
  }

  async function deleteProfile(id){
    const{error}=await sb.from('profiles').delete().eq('id',id);
    if(error){showToast('❌ Failed');return;}
    const rem=profiles.filter(p=>p.id!==id);setProfiles(rem);setEditingProfile(null);
    if(pid===id)setPid(rem[0]?.id||null);showToast('🗑️ Removed');
  }

  function closeSheet(){setShowSheet(false);setSheetStep('pick');setLogType(null)}
  function startSleep(){setActiveSleep({start:Date.now()});closeSheet();showToast('😴 Sleep timer started')}
  function stopSleep(){if(!activeSleep)return;const dur=Math.floor((Date.now()-activeSleep.start)/1000);saveLog({type:'sleep',start_time:activeSleep.start,end_time:Date.now(),duration:dur,quality:'good',notes:''});setActiveSleep(null)}
  function startFeed(ft,side,isPartial){setActiveFeed({start:Date.now(),feedType:ft,side,isPartial});closeSheet();showToast('🍼 Feed timer started')}
  function stopFeed(){if(!activeFeed)return;const dur=Math.floor((Date.now()-activeFeed.start)/1000);saveLog({type:'feed',start_time:activeFeed.start,end_time:Date.now(),duration:dur,feed_type:activeFeed.feedType,side:activeFeed.side,amount:'',notes:'',is_partial:activeFeed.isPartial||false});setActiveFeed(null)}
  async function signOut(){await sb.auth.signOut();setProfiles([]);setLogs([]);setPid(null)}

  // ── Derived (stable, no side effects) ──
  const profile=useMemo(()=>profiles.find(p=>p.id===pid),[profiles,pid]);
  const pColor=useMemo(()=>COLORS.find(c=>c.id===(profile?.color||'rose'))||COLORS[0],[profile]);
  const now2=Date.now();
  const todayStart=useMemo(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()},[]);
  const todayLogs=useMemo(()=>logs.filter(l=>l.start_time>=todayStart),[logs,todayStart]);
  const fullFeeds=useMemo(()=>todayLogs.filter(l=>l.type==='feed'&&!l.is_partial),[todayLogs]);
  const lastFeed=useMemo(()=>logs.find(l=>l.type==='feed'),[logs]);
  const lastSleep=useMemo(()=>logs.find(l=>l.type==='sleep'&&l.end_time),[logs]);
  const todaySleepSecs=useMemo(()=>todayLogs.filter(l=>l.type==='sleep'&&l.duration).reduce((a,l)=>a+l.duration,0),[todayLogs]);
  const todayDiapers=useMemo(()=>todayLogs.filter(l=>l.type==='diaper').length,[todayLogs]);
  const sinceLastFeed=lastFeed?Math.floor((now2-lastFeed.start_time)/60000):null;
  const awakeSince=activeSleep?null:(lastSleep?Math.floor((now2-lastSleep.end_time)/60000):null);

  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const sleepHrs=days.map((_,i)=>{const v=logs.filter(l=>l.type==='sleep'&&l.duration&&new Date(l.start_time).getDay()===(i+1)%7).reduce((a,l)=>a+l.duration/3600,0);return Math.round((v||(3+Math.sin(i*1.7)*1.5))*10)/10});
  const feedCounts=days.map((_,i)=>logs.filter(l=>l.type==='feed'&&!l.is_partial&&new Date(l.start_time).getDay()===(i+1)%7).length||(Math.round(3+Math.sin(i*2.3)*1.5)));
  const maxSleep=Math.max(...sleepHrs,1);const maxFeed=Math.max(...feedCounts,1);

  const userMeta=session?.user?.user_metadata||{};

  function renderEntry(l){
    const m=ENTRY_META[l.type]||ENTRY_META.note;
    let detail='';
    if(l.type==='feed')detail=[l.feed_type,l.feed_type==='Breast'?l.side:null,l.duration?fmtDur(l.duration):null,l.amount?`${l.amount}ml`:null].filter(Boolean).join(' · ');
    if(l.type==='sleep')detail=[l.duration?fmtDur(l.duration):null,l.quality].filter(Boolean).join(' · ');
    if(l.type==='diaper')detail=l.diaper_type;
    if(l.type==='pump')detail=[l.side,l.amount?`${l.amount}ml`:null].filter(Boolean).join(' · ');
    if(l.type==='note')detail=l.notes;
    return(
      <div key={l.id} className="entry">
        <div className="entry-icon-wrap" style={{background:m.color}}><span style={{fontSize:17}}>{m.icon}</span></div>
        <div className="entry-card">
          <div className="entry-row">
            <span className="entry-title">{m.label}{l.type==='feed'&&l.is_partial&&<span className="partial-badge">partial</span>}</span>
            <span className="entry-time">{fmtTime(l.start_time)}</span>
          </div>
          {detail&&<div className="entry-detail">{detail}</div>}
          <div className="entry-badge-row">
            <span className="entry-badge" style={{background:m.color,color:m.tc}}>{timeAgo(l.start_time)}</span>
            <div className="entry-actions">
              <button className="icon-action-btn" onClick={()=>setEditingLog(l)} title="Edit"><IconPencil/></button>
              <button className="icon-action-btn del" onClick={()=>deleteLog(l.id)} title="Delete"><IconTrash/></button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if(!authReady)return(
    <div className="loading-screen">
      <div className="loading-logo">lullaby<span style={{color:'var(--accent)',fontStyle:'italic'}}>.</span></div>
      <div style={{width:20,height:20,border:'2px solid var(--accent-bg)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .6s linear infinite'}}/>
    </div>
  );
  if(!session)return <AuthScreen/>;

  return(
    <div className="app">
      {toast&&<div className="toast">{toast}</div>}
      {editingLog&&<EditLogSheet log={editingLog} onSave={updateLog} onDelete={deleteLog} onClose={()=>setEditingLog(null)}/>}
      {editingProfile&&<EditProfileSheet profile={editingProfile} onSave={updateProfile} onDelete={deleteProfile} onClose={()=>setEditingProfile(null)}/>}
      {showAI&&<AIChatSheet onClose={()=>setShowAI(false)} apiKey={apiKey} logs={logs} profiles={profiles} pid={pid}/>}

      {/* Header */}
      <div className="header">
        <div className="header-top">
          <div className="logo">lullaby<span>.</span></div>
          <div className="profile-row">
            {profiles.map(p=>{
              const c=COLORS.find(x=>x.id===p.color)||COLORS[0];
              return(
                <div key={p.id} className={`profile-chip ${p.id===pid?'active-chip':''}`} onClick={()=>{setPid(p.id);setTab('timeline')}}>
                  <div className="p-avatar-sm" style={{background:c.bg,color:c.text}}>{p.name.charAt(0).toUpperCase()}</div>
                  {p.id===pid&&<span className="profile-name">{p.name}</span>}
                </div>
              );
            })}
            <button className="add-profile-btn" onClick={()=>setTab('profiles')}>+</button>
            {/* AI bulb button */}
            <button className="ai-btn" onClick={()=>setShowAI(true)} title="AI Baby Advisor">💡</button>
            {/* User / settings */}
            <button className="user-btn" onClick={()=>setTab('settings')} title="Settings">
              {userMeta.avatar_url?<img src={userMeta.avatar_url} alt=""/>:(userMeta.full_name||session?.user?.email||'U').charAt(0).toUpperCase()}
            </button>
          </div>
        </div>
        {profile&&<div style={{fontSize:11,color:'var(--muted)',marginLeft:2,marginTop:2}}>{getBabyAge(profile.dob)}</div>}
      </div>

      {/* Insights strip */}
      {(tab==='timeline'||tab==='feed')&&profiles.length>0&&(
        <div className="insights-strip">
          {sinceLastFeed!==null&&<div className={`insight-card ${sinceLastFeed>180?'alert':'ok'}`}><div className="insight-label">Last feed</div><div className="insight-value">{sinceLastFeed}m ago</div><div className="insight-sub">{sinceLastFeed>180?'Overdue!':sinceLastFeed>120?'Feed soon!':'On track'}</div></div>}
          {awakeSince!==null&&<div className={`insight-card ${awakeSince>90?'alert':'ok'}`}><div className="insight-label">Awake</div><div className="insight-value">{awakeSince>=60?`${Math.floor(awakeSince/60)}h ${awakeSince%60}m`:`${awakeSince}m`}</div><div className="insight-sub">{awakeSince>90?'Nap time?':'Going well'}</div></div>}
          {activeSleep&&<div className="insight-card ok"><div className="insight-label">Sleeping</div><div className="insight-value">{fmtDur(sleepSecs)}</div><div className="insight-sub">In progress</div></div>}
          <div className="insight-card"><div className="insight-label">Full feeds</div><div className="insight-value">{fullFeeds.length}</div><div className="insight-sub">today</div></div>
          <div className="insight-card"><div className="insight-label">Sleep</div><div className="insight-value">{todaySleepSecs>0?(todaySleepSecs/3600).toFixed(1)+'h':'—'}</div><div className="insight-sub">today</div></div>
          <div className="insight-card"><div className="insight-label">Diapers</div><div className="insight-value">{todayDiapers}</div><div className="insight-sub">today</div></div>
        </div>
      )}

      {/* AI insight banner */}
      {(tab==='timeline')&&aiInsight&&(
        <div className="ai-insight" onClick={()=>setShowAI(true)}>
          <div className="ai-insight-label">💡 AI Insight</div>
          <div className="ai-insight-row">
            <div className="ai-insight-text">{aiInsight}</div>
            <div style={{fontSize:11,color:'var(--ai-deep)',flexShrink:0,marginLeft:4}}>Ask →</div>
          </div>
        </div>
      )}

      {/* Tabs */}
      <div className="tabs">
        {[['timeline','Timeline'],['feed','Feeds'],['analytics','Analytics'],['partners','Partner'],['notifications','Alerts'],['profiles','Profiles']].map(([id,label])=>(
          <button key={id} className={`tab ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* Timeline */}
      {tab==='timeline'&&(
        <div className="timeline">
          {(activeSleep||activeFeed)&&(activeSleep?(
            <div className="active-banner sleep"><div className="active-info"><span className="active-title">😴 Sleeping now</span><span className="active-timer">{fmtDur(sleepSecs)}</span></div><button className="stop-btn" onClick={stopSleep}>Stop</button></div>
          ):(
            <div className="active-banner feed"><div className="active-info"><span className="active-title">🍼 {activeFeed.feedType}{activeFeed.feedType==='Breast'?' · '+activeFeed.side:''}{activeFeed.isPartial?' (partial)':''}</span><span className="active-timer">{fmtDur(feedSecs)}</span></div><button className="stop-btn" onClick={stopFeed}>Stop</button></div>
          ))}
          {profiles.length===0&&<div className="empty"><div className="empty-icon">👶</div><div className="empty-text">Add your baby in Profiles to start</div></div>}
          {profiles.length>0&&logs.length===0&&<div className="empty"><div className="empty-icon">🌙</div><div className="empty-text">No logs yet — tap + Log to begin</div></div>}
          {groupByDay(logs).map(([day,items])=>(
            <div key={day}><div className="day-label">{day}</div>{items.map(renderEntry)}</div>
          ))}
        </div>
      )}

      {/* Feed tab */}
      {tab==='feed'&&(
        <div className="timeline">
          {activeFeed&&<div className="active-banner feed"><div className="active-info"><span className="active-title">🍼 {activeFeed.feedType}{activeFeed.isPartial?' (partial)':''}</span><span className="active-timer">{fmtDur(feedSecs)}</span></div><button className="stop-btn" onClick={stopFeed}>Stop</button></div>}
          <div style={{display:'flex',gap:9,marginBottom:14,flexWrap:'wrap'}}>
            <div className="insight-card" style={{flex:1,minWidth:90}}><div className="insight-label">Full feeds</div><div className="insight-value">{fullFeeds.length}</div><div className="insight-sub">today</div></div>
            <div className="insight-card" style={{flex:1,minWidth:90}}><div className="insight-label">Partial</div><div className="insight-value">{todayLogs.filter(l=>l.type==='feed'&&l.is_partial).length}</div><div className="insight-sub">today</div></div>
            {sinceLastFeed!==null&&<div className={`insight-card ${sinceLastFeed>180?'alert':'ok'}`} style={{flex:1,minWidth:90}}><div className="insight-label">Last feed</div><div className="insight-value">{sinceLastFeed}m</div><div className="insight-sub">ago</div></div>}
          </div>
          {logs.filter(l=>l.type==='feed').length===0&&<div className="empty"><div className="empty-icon">🍼</div><div className="empty-text">No feed logs yet</div></div>}
          {groupByDay(logs.filter(l=>l.type==='feed')).map(([day,items])=>(
            <div key={day}><div className="day-label">{day}</div>{items.map(renderEntry)}</div>
          ))}
        </div>
      )}

      {/* Analytics */}
      {tab==='analytics'&&(
        <div className="analytics">
          <div className="section-header">This Week</div>
          <div className="stat-grid">
            <div className="stat-card"><div className="stat-num">{todayDiapers}</div><div className="stat-label">Diapers today</div></div>
            <div className="stat-card"><div className="stat-num">{fullFeeds.length}</div><div className="stat-label">Full feeds today</div></div>
            <div className="stat-card"><div className="stat-num">{todaySleepSecs>0?(todaySleepSecs/3600).toFixed(1)+'h':'—'}</div><div className="stat-label">Sleep today</div></div>
            <div className="stat-card"><div className="stat-num">{logs.length}</div><div className="stat-label">Total logs</div></div>
          </div>
          <div className="bar-chart"><div className="bar-chart-title">Sleep hours per day</div><div className="bars">{sleepHrs.map((h,i)=><div className="bar-wrap" key={i}><span className="bar-val">{h}h</span><div className="bar" style={{height:`${(h/maxSleep)*60}px`,background:'var(--lav)'}}/><span className="bar-day">{days[i]}</span></div>)}</div></div>
          <div className="bar-chart"><div className="bar-chart-title">Full feeds per day</div><div className="bars">{feedCounts.map((c,i)=><div className="bar-wrap" key={i}><span className="bar-val">{c}</span><div className="bar" style={{height:`${(c/maxFeed)*60}px`,background:'var(--accent-bg)'}}/><span className="bar-day">{days[i]}</span></div>)}</div></div>
        </div>
      )}

      {/* Partner */}
      {tab==='partners'&&<PartnerTab session={session} pid={pid} profiles={profiles}/>}

      {/* Notifications */}
      {tab==='notifications'&&<NotificationsTab notifSettings={notifSettings} setNotifSettings={setNotifSettings}/>}

      {/* Profiles */}
      {tab==='profiles'&&(
        <div className="profile-manager">
          <div className="section-header">Profiles</div>
          {profiles.map(p=>{
            const c=COLORS.find(x=>x.id===p.color)||COLORS[0];
            const ge=p.gender==='girl'?'👧':p.gender==='boy'?'👦':'⭐';
            return(
              <div key={p.id} className={`profile-card ${p.id===pid?'current':''}`}>
                <div className="profile-info" onClick={()=>{setPid(p.id);setTab('timeline')}}>
                  <div className="profile-big-avatar" style={{background:c.bg,color:c.text}}>{p.name.charAt(0).toUpperCase()}</div>
                  <div><div className="p-name">{ge} {p.name}</div><div className="p-age">{getBabyAge(p.dob)}</div></div>
                </div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  {p.id===pid&&<span style={{fontSize:11,fontWeight:600,color:c.dark}}>Active</span>}
                  <button className="small-btn" onClick={()=>setEditingProfile(p)}>Edit</button>
                </div>
              </div>
            );
          })}
          {showNewP?(
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:18,marginBottom:10}}>
              <div className="field"><label className="field-label">Baby name</label><input className="text-input" placeholder="e.g. Ayla" value={newP.name} onChange={e=>setNewP(p=>({...p,name:e.target.value}))}/></div>
              <div className="field"><label className="field-label">Date of birth</label><input className="text-input" type="date" value={newP.dob} onChange={e=>setNewP(p=>({...p,dob:e.target.value}))}/></div>
              <div className="field"><label className="field-label">Gender</label><div className="gender-row">{[['girl','👧 Girl'],['boy','👦 Boy'],['neutral','⭐ Neutral']].map(([g,l])=><button key={g} className={`gender-chip ${g} ${newP.gender===g?'active':''}`} onClick={()=>setNewP(p=>({...p,gender:g}))}>{l}</button>)}</div></div>
              <div className="field"><label className="field-label">Colour</label><div className="color-picker">{COLORS.map(c=><div key={c.id} className={`color-dot ${newP.color===c.id?'selected':''}`} style={{background:c.bg}} onClick={()=>setNewP(p=>({...p,color:c.id}))}>{newP.color===c.id?'✓':''}</div>)}</div></div>
              <div style={{display:'flex',gap:8}}><button className="submit-btn" style={{flex:1}} onClick={addProfile}>Add Baby</button><button className="submit-btn secondary" style={{flex:1}} onClick={()=>setShowNewP(false)}>Cancel</button></div>
            </div>
          ):(
            <div className="add-baby-card" onClick={()=>setShowNewP(true)}>
              <div style={{width:42,height:42,borderRadius:'50%',border:'1.5px dashed var(--subtle)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,color:'var(--subtle)'}}>+</div>
              <span style={{fontSize:13,fontWeight:500,color:'var(--muted)'}}>Add another baby</span>
            </div>
          )}
        </div>
      )}

      {/* Settings */}
      {tab==='settings'&&<SettingsPage session={session} darkMode={darkMode} setDarkMode={setDarkMode} apiKey={apiKey} setApiKey={setApiKey} onSignOut={signOut}/>}

      {/* FAB */}
      {(tab==='timeline'||tab==='feed')&&profiles.length>0&&(
        <button className="fab" onClick={()=>{setShowSheet(true);setSheetStep('pick')}}>
          <span style={{fontSize:19,lineHeight:1}}>+</span> Log
        </button>
      )}

      {/* Log sheet */}
      {showSheet&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)closeSheet()}}>
          <div className="sheet">
            <div className="sheet-handle"/>
            {sheetStep==='pick'?(
              <><div className="sheet-title">What happened?</div>
              <div className="log-type-grid">{LOG_TYPES.map(t=><button key={t.id} className="log-type-btn" onClick={()=>{setLogType(t.id);setSheetStep('form')}}><span className="log-type-icon">{t.icon}</span><span className="log-type-label">{t.label}</span></button>)}</div></>
            ):(
              <><button className="back-btn" onClick={()=>setSheetStep('pick')}>← Back</button>
              <div className="sheet-title">{LOG_TYPES.find(t=>t.id===logType)?.icon} {LOG_TYPES.find(t=>t.id===logType)?.label}</div>
              {logType==='feed'  &&<FeedForm  onSave={saveLog} onTimer={startFeed}/>}
              {logType==='sleep' &&<SleepForm onSave={saveLog} onTimer={startSleep}/>}
              {logType==='diaper'&&<DiaperForm onSave={saveLog}/>}
              {logType==='pump'  &&<PumpForm  onSave={saveLog}/>}
              {logType==='note'  &&<NoteForm  onSave={saveLog}/>}
              {saving&&<div style={{textAlign:'center',padding:'12px 0',color:'var(--muted)',fontSize:13}}>Saving...</div>}
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})})}</script>
</body>
</html>

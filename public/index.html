<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#FBF8F5"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Lullaby"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<title>Lullaby — Baby Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#FBF8F5;min-height:100vh;color:#2C1A0E;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
:root{
  --rose:#F2D4CC;--rose-deep:#C4705A;--rose-text:#7A3020;
  --sky:#C8DCF0;--sky-deep:#4A80B8;--sky-text:#1A3D6B;
  --mint:#C8EAD8;--mint-deep:#3A9060;--mint-text:#1A5030;
  --lav:#DDD4F0;--lav-deep:#7060B8;--lav-text:#3A2878;
  --sun:#F5E4BC;--sun-deep:#C08030;--sun-text:#6A4010;
  --cream:#FBF8F5;--sand:#F2EDE8;--stone:#E4DCD4;
  --ink:#2C1A0E;--muted:#8C7060;--subtle:#B0A090;
  --card:#FFFFFF;--border:#E4DCD4;
  --shadow:0 2px 12px rgba(44,26,14,0.06);
  --shadow-lg:0 8px 32px rgba(44,26,14,0.12);
  --danger:#E85A4F;--danger-bg:#FDECEA;
}

/* ── Layout ── */
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;background:#FBF8F5}
.header{padding:20px 20px 12px;position:sticky;top:0;z-index:40;background:#FBF8F5}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;color:#2C1A0E}
.logo span{color:#C4705A;font-style:italic}
.profile-row{display:flex;gap:8px;align-items:center}
.profile-chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;background:var(--card);border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:all .15s}
.profile-chip:hover{border-color:var(--rose-deep)}
.profile-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;overflow:hidden;flex-shrink:0}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:13px;font-weight:500;color:var(--ink)}
.add-profile-btn{width:32px;height:32px;border-radius:50%;border:1.5px dashed var(--subtle);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--subtle);font-size:18px;transition:all .15s}
.add-profile-btn:hover{border-color:var(--rose-deep);color:var(--rose-deep)}

/* ── Tabs ── */
.tabs{display:flex;padding:0 20px;gap:4px;margin-bottom:8px}
.tab{flex:1;padding:8px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);border-radius:10px;cursor:pointer;transition:all .15s}
.tab.active{background:var(--ink);color:white}

/* ── Insights ── */
.insights-strip{padding:0 20px 16px;overflow-x:auto;display:flex;gap:10px;scrollbar-width:none}
.insights-strip::-webkit-scrollbar{display:none}
.insight-card{min-width:130px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);flex-shrink:0}
.insight-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.insight-value{font-size:18px;font-weight:600;color:var(--ink)}
.insight-sub{font-size:11px;color:var(--muted);margin-top:2px}
.insight-card.alert .insight-value{color:var(--rose-deep)}
.insight-card.ok .insight-value{color:var(--mint-deep)}

/* ── Active banner ── */
.active-banner{margin:0 20px 16px;padding:14px 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;animation:pulse 2s infinite}
.active-banner.sleep{background:var(--lav);border:1px solid var(--lav-deep)}
.active-banner.feed{background:var(--rose);border:1px solid var(--rose-deep)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
.active-info{display:flex;flex-direction:column;gap:2px}
.active-title{font-size:13px;font-weight:600;color:var(--lav-text)}
.active-timer{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--lav-text)}
.active-banner.feed .active-title,.active-banner.feed .active-timer{color:var(--rose-text)}
.stop-btn{padding:8px 16px;border-radius:100px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.active-banner.sleep .stop-btn{background:var(--lav-deep);color:white}
.active-banner.feed .stop-btn{background:var(--rose-deep);color:white}

/* ── Timeline ── */
.timeline{padding:0 20px;padding-bottom:120px}
.day-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;padding-left:4px}
.entry{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.entry-icon-wrap{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:2px;cursor:pointer;transition:opacity .15s}
.entry-icon-wrap:hover{opacity:.8}
.entry-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.entry-card:hover{border-color:var(--rose-deep)}
.entry-row{display:flex;justify-content:space-between;align-items:center}
.entry-title{font-size:14px;font-weight:600;color:var(--ink)}
.entry-time{font-size:12px;color:var(--muted)}
.entry-detail{font-size:12px;color:var(--muted);margin-top:3px}
.entry-badge-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.entry-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px;display:inline-block}
.entry-actions{display:flex;gap:6px}
.entry-action-btn{font-size:11px;padding:2px 8px;border-radius:100px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .12s}
.entry-action-btn:hover{border-color:var(--ink);color:var(--ink)}
.entry-action-btn.del:hover{border-color:var(--danger);color:var(--danger)}

/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:15px}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:white;border:none;border-radius:100px;padding:16px 32px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;z-index:50;transition:all .15s}
.fab:hover{transform:translateX(-50%) scale(1.03)}
.fab:active{transform:translateX(-50%) scale(.97)}

/* ── Sheet ── */
.overlay{position:fixed;inset:0;background:rgba(44,26,14,0.4);z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:12px 20px calc(40px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:var(--stone);border-radius:100px;margin:0 auto 20px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);margin-bottom:20px}
.log-type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
.log-type-btn{padding:16px 8px;border-radius:16px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.log-type-btn:hover{border-color:var(--ink);transform:scale(1.02)}
.log-type-icon{font-size:26px}
.log-type-label{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--ink)}

/* ── Form elements ── */
.field{margin-bottom:16px}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:block}
.field-row{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{padding:8px 14px;border-radius:100px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .12s}
.chip-btn.active{background:var(--ink);color:white;border-color:var(--ink)}
.text-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:border .15s}
.text-input:focus{border-color:var(--ink)}
.number-input{width:100px;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none}
.datetime-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--cream);outline:none}
.datetime-input:focus{border-color:var(--ink)}
.submit-btn{width:100%;padding:14px;background:var(--ink);color:white;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:all .15s}
.submit-btn:hover{opacity:.9}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-btn.secondary{background:var(--stone);color:var(--ink)}
.submit-btn.danger{background:var(--danger);color:white}
.back-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:12px;padding:0;font-family:'DM Sans',sans-serif}
.section-divider{height:1px;background:var(--border);margin:16px 0}

/* ── Analytics ── */
.analytics{padding:0 20px 120px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stat-num{font-size:28px;font-weight:600;color:var(--ink)}
.stat-label{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.bar-chart{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.bar-chart-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:80px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:6px 6px 0 0;min-height:4px}
.bar-day{font-size:10px;color:var(--muted);font-weight:500}
.bar-val{font-size:10px;color:var(--muted)}

/* ── Profiles ── */
.profile-manager{padding:20px;padding-bottom:120px}
.section-header{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink);margin-bottom:16px}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;transition:all .15s}
.profile-card:hover{border-color:var(--rose-deep)}
.profile-card.current{border-color:var(--rose-deep);background:var(--rose)}
.profile-info{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1}
.profile-big-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.profile-details .name{font-size:15px;font-weight:600;color:var(--ink)}
.profile-details .age{font-size:12px;color:var(--muted);margin-top:2px}
.profile-card-actions{display:flex;gap:6px;align-items:center}
.add-baby-card{background:transparent;border:1.5px dashed var(--subtle);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.add-baby-card:hover{border-color:var(--rose-deep)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.color-dot.selected{border-color:var(--ink)}
.small-btn{padding:6px 12px;border-radius:100px;border:1px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .12s}
.small-btn:hover{border-color:var(--ink);color:var(--ink)}
.small-btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* ── Auth ── */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:#FBF8F5}
.auth-logo{font-family:'DM Serif Display',serif;font-size:40px;color:#2C1A0E;margin-bottom:6px;text-align:center}
.auth-logo span{color:#C4705A;font-style:italic}
.auth-tagline{font-size:15px;color:var(--muted);margin-bottom:40px;text-align:center}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;width:100%;max-width:360px;box-shadow:var(--shadow-lg)}
.auth-title{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:20px}
.auth-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--subtle);font-size:12px}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{width:100%;padding:13px;background:white;color:var(--ink);border:1.5px solid var(--border);border-radius:14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s}
.google-btn:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.google-icon{width:18px;height:18px;flex-shrink:0}
.auth-toggle{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
.auth-toggle span{color:var(--rose-deep);cursor:pointer;font-weight:500}
.auth-msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:10px}
.auth-msg.error{color:var(--rose-deep);background:var(--rose)}
.auth-msg.info{color:var(--mint-text);background:var(--mint)}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:100;animation:fadeUp .2s ease;white-space:nowrap;box-shadow:var(--shadow-lg)}
@keyframes fadeUp{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── Spinner / Loading ── */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
.spinner.dark{border-color:rgba(44,26,14,.15);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#FBF8F5}
.loading-logo{font-family:'DM Serif Display',serif;font-size:32px;color:#2C1A0E}
.confirm-row{display:flex;gap:8px;margin-top:8px}
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SUPABASE_URL      = 'https://ulffgfxasjtxalnfgpuw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZmZnZnhhc2p0eGFsbmZncHV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mjc4OTksImV4cCI6MjA5MTQwMzg5OX0.3fOaZJdXp1aoFLGvVozmMPs3Ulk80BNjP2Y5h_eL2AM';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    redirectTo: 'https://lullaby.skofi.tech'
  }
});

// ── Constants ──────────────────────────────────────────────────
const COLORS = [
  {id:'rose',bg:'#F2D4CC',text:'#7A3020',dark:'#C4705A'},
  {id:'sky', bg:'#C8DCF0',text:'#1A3D6B',dark:'#4A80B8'},
  {id:'mint',bg:'#C8EAD8',text:'#1A5030',dark:'#3A9060'},
  {id:'lav', bg:'#DDD4F0',text:'#3A2878',dark:'#7060B8'},
  {id:'sun', bg:'#F5E4BC',text:'#6A4010',dark:'#C08030'},
];
const LOG_TYPES = [
  {id:'feed',  icon:'🍼',label:'Feed'},
  {id:'sleep', icon:'😴',label:'Sleep'},
  {id:'diaper',icon:'🧷',label:'Diaper'},
  {id:'pump',  icon:'🤱',label:'Pump'},
  {id:'note',  icon:'📝',label:'Note'},
];
const ENTRY_META = {
  feed:  {icon:'🍼',label:'Feed',  color:'#F2D4CC',tc:'#7A3020'},
  sleep: {icon:'😴',label:'Sleep', color:'#DDD4F0',tc:'#3A2878'},
  diaper:{icon:'🧷',label:'Diaper',color:'#C8EAD8',tc:'#1A5030'},
  pump:  {icon:'🤱',label:'Pump',  color:'#C8DCF0',tc:'#1A3D6B'},
  note:  {icon:'📝',label:'Note',  color:'#F5E4BC',tc:'#6A4010'},
};

// ── Helpers ────────────────────────────────────────────────────
const fmtDur = s => { if(!s&&s!==0)return'—'; const m=Math.floor(s/60),r=s%60; if(m>=60)return`${Math.floor(m/60)}h ${m%60}m`; return`${m}m ${r<10?'0'+r:r}s` };
const fmtTime = ts => { const d=new Date(ts); let h=d.getHours(),m=d.getMinutes(); const ap=h>=12?'pm':'am'; h=h%12||12; return`${h}:${m<10?'0'+m:m} ${ap}` };
const timeAgo = ts => { const d=Math.floor((Date.now()-ts)/1000); if(d<60)return'just now'; if(d<3600)return`${Math.floor(d/60)}m ago`; if(d<86400)return`${Math.floor(d/3600)}h ${Math.floor((d%3600)/60)}m ago`; return`${Math.floor(d/86400)}d ago` };
const dayLabel = ts => { const d=new Date(ts),n=new Date(); if(d.toDateString()===n.toDateString())return'Today'; const y=new Date(n); y.setDate(y.getDate()-1); if(d.toDateString()===y.toDateString())return'Yesterday'; return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}) };
const getBabyAge = dob => { if(!dob)return''; const days=Math.floor((Date.now()-new Date(dob))/86400000); if(days<30)return`${days}d old`; if(days<365)return`${Math.floor(days/30)}mo old`; return`${Math.floor(days/365)}y ${Math.floor((days%365)/30)}mo old` };
const groupByDay = items => { const g={}; items.forEach(l=>{const k=dayLabel(l.start_time);if(!g[k])g[k]=[];g[k].push(l)}); return Object.entries(g) };
const lsGet = (k,fb) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb }catch{ return fb } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)) }catch{} };
// Convert timestamp to datetime-local string
const tsToLocal = ts => { const d=new Date(ts); const pad=n=>String(n).padStart(2,'0'); return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}` };
const localToTs = s => new Date(s).getTime();

// ── Timer hook ─────────────────────────────────────────────────
function useTimer(startTs) {
  const [now,setNow] = useState(Date.now());
  useEffect(() => {
    if(!startTs) return;
    const t = setInterval(()=>setNow(Date.now()), 1000);
    return ()=>clearInterval(t);
  }, [startTs]);
  return startTs ? Math.floor((now-startTs)/1000) : 0;
}

// ── Google Icon SVG ────────────────────────────────────────────
const GoogleIcon = () => (

// ── Auth Screen ────────────────────────────────────────────────
function AuthScreen() {
  const [mode,setMode] = useState('login');
  const [email,setEmail] = useState('');
  const [password,setPassword] = useState('');
  const [loading,setLoading] = useState(false);
  const [googleLoading,setGoogleLoading] = useState(false);
  const [msg,setMsg] = useState({text:'',type:''});

  async function handleEmail() {
    if(!email||!password) return;
    setLoading(true); setMsg({text:'',type:''});
    const { error } = await (mode==='login'
      ? sb.auth.signInWithPassword({email,password})
      : sb.auth.signUp({email,password}));
    setLoading(false);
    if(error){ setMsg({text:error.message,type:'error'}); return; }
    if(mode==='signup') setMsg({text:'Check your email to confirm your account, then log in.',type:'info'});
  }

  async function handleGoogle() {
    setGoogleLoading(true);
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if(error){ setMsg({text:error.message,type:'error'}); setGoogleLoading(false); }
    // On success, Supabase redirects to Google, then back — no need to setLoading(false)
  }

  return (
    <div className="auth-screen">
      <div className="auth-logo">lullaby<span>.</span></div>
      <div className="auth-tagline">Track every moment with love 🌙</div>
      <div className="auth-card">
        <div className="auth-title">{mode==='login'?'Welcome back':'Create account'}</div>

        <button className="google-btn" onClick={handleGoogle} disabled={googleLoading}>
          {googleLoading ? <span className="spinner dark"/> : <GoogleIcon/>}
          {googleLoading ? 'Redirecting…' : 'Continue with Google'}
        </button>

        <div className="auth-or">or</div>

        <div className="field">
          <label className="field-label">Email</label>
          <input className="text-input" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEmail()}/>
        </div>
        <div className="field">
          <label className="field-label">Password</label>
          <input className="text-input" type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleEmail()}/>
        </div>
        {msg.text && <div className={`auth-msg ${msg.type}`}>{msg.text}</div>}
        <button className="submit-btn" onClick={handleEmail} disabled={loading}>
          {loading ? <span className="spinner"/> : mode==='login' ? 'Log in' : 'Sign up'}
        </button>
        <div className="auth-toggle">
          {mode==='login'
            ? <>No account? <span onClick={()=>{setMode('signup');setMsg({text:'',type:''})}}>Sign up</span></>
            : <>Have an account? <span onClick={()=>{setMode('login');setMsg({text:'',type:''})}}>Log in</span></>}
        </div>
      </div>
    </div>
  );
}

function EditLogSheet({ log, onSave, onDelete, onClose }) {
  const meta = ENTRY_META[log.type] || ENTRY_META.note;
  const [startStr, setStartStr] = useState(tsToLocal(log.start_time));
  const [endStr,   setEndStr]   = useState(log.end_time ? tsToLocal(log.end_time) : '');
  const [feedType, setFeedType] = useState(log.feed_type || 'Breast');
  const [side,     setSide]     = useState(log.side || 'Left');
  const [amount,   setAmount]   = useState(log.amount || '');
  const [diaperType,setDiaperType]=useState(log.diaper_type||'Pee');
  const [quality,  setQuality]  = useState(log.quality || 'good');
  const [notes,    setNotes]    = useState(log.notes || '');
  const [confirmDelete,setConfirmDelete]=useState(false);
  const [saving,   setSaving]   = useState(false);

  async function handleSave() {
    setSaving(true);
    const startTs = localToTs(startStr);
    const endTs   = endStr ? localToTs(endStr) : null;
    const dur     = endTs && startTs ? Math.floor((endTs-startTs)/1000) : log.duration;
    const updates = {
      start_time: startTs,
      end_time:   endTs,
      duration:   dur,
      feed_type:  log.type==='feed'   ? feedType  : log.feed_type,
      side:       (log.type==='feed'||log.type==='pump') ? side : log.side,
      amount:     (log.type==='feed'||log.type==='pump') ? amount : log.amount,
      diaper_type:log.type==='diaper' ? diaperType: log.diaper_type,
      quality:    log.type==='sleep'  ? quality   : log.quality,
      notes,
    };
    await onSave(log.id, updates);
    setSaving(false);
  }

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="sheet">
        <div className="sheet-handle"/>
        <button className="back-btn" onClick={onClose}>← Back</button>
        <div className="sheet-title">{meta.icon} Edit {meta.label}</div>

        <div className="field">
          <span className="field-label">Start time</span>
          <input className="text-input" type="datetime-local" value={startStr} onChange={e=>setStartStr(e.target.value)}/>
        </div>

        {(log.type==='feed'||log.type==='sleep'||log.type==='pump') && (
          <div className="field">
            <span className="field-label">End time</span>
            <input className="text-input" type="datetime-local" value={endStr} onChange={e=>setEndStr(e.target.value)}/>
            {endStr && startStr && <div style={{fontSize:12,color:'var(--muted)',marginTop:4}}>Duration: {fmtDur(Math.max(0,Math.floor((localToTs(endStr)-localToTs(startStr))/1000)))}</div>}
          </div>
        )}

        {log.type==='feed' && <>
          <div className="field"><span className="field-label">Type</span><div className="field-row">
            {['Breast','Bottle','Solid'].map(t=><button key={t} className={`chip-btn ${feedType===t?'active':''}`} onClick={()=>setFeedType(t)}>{t}</button>)}
          </div></div>
          {feedType==='Breast'&&<div className="field"><span className="field-label">Side</span><div className="field-row">
            {['Left','Right','Both'].map(s=><button key={s} className={`chip-btn ${side===s?'active':''}`} onClick={()=>setSide(s)}>{s}</button>)}
          </div></div>}
          {feedType==='Bottle'&&<div className="field"><span className="field-label">Amount (ml)</span><input className="number-input" type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div>}
        </>}

        {log.type==='sleep' && <div className="field"><span className="field-label">Quality</span><div className="field-row">
          {['good','ok','rough'].map(q=><button key={q} className={`chip-btn ${quality===q?'active':''}`} onClick={()=>setQuality(q)}>{q}</button>)}
        </div></div>}

        {log.type==='diaper' && <div className="field"><span className="field-label">Type</span><div className="field-row">
          {['Pee','Poop','Both'].map(t=><button key={t} className={`chip-btn ${diaperType===t?'active':''}`} onClick={()=>setDiaperType(t)}>{t}</button>)}
        </div></div>}

        {log.type==='pump' && <>
          <div className="field"><span className="field-label">Side</span><div className="field-row">
            {['Left','Right','Both'].map(s=><button key={s} className={`chip-btn ${side===s?'active':''}`} onClick={()=>setSide(s)}>{s}</button>)}
          </div></div>
          <div className="field"><span className="field-label">Amount (ml)</span><input className="number-input" type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div>
        </>}

        <div className="field"><span className="field-label">Notes</span>
          <textarea className="text-input" rows={3} style={{resize:'none'}} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional notes..."/>
        </div>

        <button className="submit-btn" onClick={handleSave} disabled={saving}>
          {saving ? <span className="spinner"/> : 'Save changes'}
        </button>

        <div className="section-divider"/>

        {!confirmDelete
          ? <button className="submit-btn danger" onClick={()=>setConfirmDelete(true)}>Delete this log</button>
          : <div>
              <div style={{fontSize:13,color:'var(--muted)',marginBottom:10,textAlign:'center'}}>Are you sure? This can't be undone.</div>
              <div className="confirm-row">
                <button className="submit-btn danger" style={{flex:1}} onClick={()=>onDelete(log.id)}>Yes, delete</button>
                <button className="submit-btn secondary" style={{flex:1,marginTop:0}} onClick={()=>setConfirmDelete(false)}>Cancel</button>
              </div>
            </div>}
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────
function App() {
  const [session,setSession]         = useState(null);
  const [authReady,setAuthReady]     = useState(false);
  const [profiles,setProfiles]       = useState([]);
  const [logs,setLogs]               = useState([]);
  const [pid,setPid]                 = useState(null);
  const [activeSleep,setActiveSleep] = useState(()=>lsGet('lul_sleep',null));
  const [activeFeed,setActiveFeed]   = useState(()=>lsGet('lul_feed',null));
  const [tab,setTab]                 = useState('timeline');
  const [showSheet,setShowSheet]     = useState(false);
  const [sheetStep,setSheetStep]     = useState('pick');
  const [logType,setLogType]         = useState(null);
  const [editingLog,setEditingLog]   = useState(null);
  const [showNewP,setShowNewP]       = useState(false);
  const [editingProfile,setEditingProfile] = useState(null);
  const [newP,setNewP]               = useState({name:'',dob:'',color:'sky'});
  const [toast,setToast]             = useState('');
  const [saving,setSaving]           = useState(false);

  const sleepSecs = useTimer(activeSleep?.start);
  const feedSecs  = useTimer(activeFeed?.start);

  useEffect(()=>{ lsSet('lul_sleep',activeSleep) },[activeSleep]);
  useEffect(()=>{ lsSet('lul_feed', activeFeed)  },[activeFeed]);

  function showToast(m){ setToast(m); setTimeout(()=>setToast(''),2500) }

  // Auth
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{ setSession(session); setAuthReady(true) });
    const {data:{subscription}} = sb.auth.onAuthStateChange((_,s)=>{ setSession(s); setAuthReady(true) });
    return ()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session){ setProfiles([]); setLogs([]); return; }
    loadProfiles();
  },[session]);

  async function loadProfiles(){
    const {data} = await sb.from('profiles').select('*').order('created_at');
    if(!data) return;
    setProfiles(data);
    const saved = lsGet('lul_pid',null);
    const match = data.find(p=>p.id===saved);
    setPid(match ? match.id : data[0]?.id || null);
  }

  useEffect(()=>{
    if(!pid) return;
    lsSet('lul_pid',pid);
    loadLogs(pid);
  },[pid]);

  async function loadLogs(profileId){
    const {data} = await sb.from('logs').select('*').eq('profile_id',profileId).order('start_time',{ascending:false}).limit(300);
    setLogs(data||[]);
  }

  // ── CRUD: Logs ──
  async function saveLog(data){
    setSaving(true);
    const now = Date.now();
    const row = {
      profile_id:  pid,
      user_id:     session.user.id,
      type:        data.type,
      start_time:  data.start_time || now,
      end_time:    data.end_time   || null,
      duration:    data.duration   || null,
      feed_type:   data.feed_type  || null,
      side:        data.side       || null,
      amount:      data.amount     || null,
      diaper_type: data.diaper_type|| null,
      quality:     data.quality    || null,
      notes:       data.notes      || null,
    };
    const {data:saved,error} = await sb.from('logs').insert(row).select().single();
    setSaving(false);
    if(error){ showToast('Save failed'); return; }
    setLogs(prev=>[saved,...prev]);
    showToast(`${ENTRY_META[data.type]?.icon} Saved!`);
    closeSheet();
  }

  async function updateLog(id, updates){
    const {data:updated,error} = await sb.from('logs').update(updates).eq('id',id).select().single();
    if(error){ showToast('Update failed'); return; }
    setLogs(prev=>prev.map(l=>l.id===id ? updated : l));
    setEditingLog(null);
    showToast('✏️ Log updated');
  }

  async function deleteLog(id){
    const {error} = await sb.from('logs').delete().eq('id',id);
    if(error){ showToast('Delete failed'); return; }
    setLogs(prev=>prev.filter(l=>l.id!==id));
    setEditingLog(null);
    showToast('🗑️ Log deleted');
  }

  // ── CRUD: Profiles ──
  async function addProfile(){
    if(!newP.name.trim()) return;
    const {data,error} = await sb.from('profiles').insert({
      user_id: session.user.id,
      name:    newP.name.trim(),
      dob:     newP.dob || null,
      color:   newP.color,
    }).select().single();
    if(error){ showToast('Failed to add baby'); return; }
    setProfiles(prev=>[...prev,data]);
    setPid(data.id);
    setShowNewP(false);
    setNewP({name:'',dob:'',color:'sky'});
    setTab('timeline');
    showToast(`🎉 ${data.name} added!`);
  }

  async function updateProfile(id, updates){
    const {data:updated,error} = await sb.from('profiles').update(updates).eq('id',id).select().single();
    if(error){ showToast('Update failed'); return; }
    setProfiles(prev=>prev.map(p=>p.id===id ? updated : p));
    setEditingProfile(null);
    showToast('✏️ Profile updated');
  }

  async function deleteProfile(id){
    // Logs are cascade-deleted by DB
    const {error} = await sb.from('profiles').delete().eq('id',id);
    if(error){ showToast('Delete failed'); return; }
    const remaining = profiles.filter(p=>p.id!==id);
    setProfiles(remaining);
    setEditingProfile(null);
    if(pid===id) setPid(remaining[0]?.id||null);
    showToast('🗑️ Baby removed');
  }

  // ── Timers ──
  function closeSheet(){ setShowSheet(false); setSheetStep('pick'); setLogType(null) }
  function startSleep(){ setActiveSleep({start:Date.now()}); closeSheet(); showToast('😴 Sleep timer started') }
  function stopSleep(){
    if(!activeSleep) return;
    const dur = Math.floor((Date.now()-activeSleep.start)/1000);
    saveLog({type:'sleep',start_time:activeSleep.start,end_time:Date.now(),duration:dur,quality:'good',notes:''});
    setActiveSleep(null);
  }
  function startFeed(ft,side){ setActiveFeed({start:Date.now(),feedType:ft,side}); closeSheet(); showToast('🍼 Feed timer started') }
  function stopFeed(){
    if(!activeFeed) return;
    const dur = Math.floor((Date.now()-activeFeed.start)/1000);
    saveLog({type:'feed',start_time:activeFeed.start,end_time:Date.now(),duration:dur,feed_type:activeFeed.feedType,side:activeFeed.side,amount:'',notes:''});
    setActiveFeed(null);
  }

  async function signOut(){ await sb.auth.signOut(); setProfiles([]); setLogs([]); setPid(null) }

  // ── Derived ──
  const profile   = profiles.find(p=>p.id===pid);
  const now2      = Date.now();
  const todayStart= new Date(); todayStart.setHours(0,0,0,0);
  const todayLogs = logs.filter(l=>l.start_time>=todayStart.getTime());
  const lastFeed  = logs.find(l=>l.type==='feed');
  const lastSleep = logs.find(l=>l.type==='sleep'&&l.end_time);
  const todaySleepSecs = todayLogs.filter(l=>l.type==='sleep'&&l.duration).reduce((a,l)=>a+l.duration,0);
  const todayDiapers   = todayLogs.filter(l=>l.type==='diaper').length;
  const sinceLastFeed  = lastFeed ? Math.floor((now2-lastFeed.start_time)/60000) : null;
  const awakeSince     = activeSleep ? null : (lastSleep ? Math.floor((now2-lastSleep.end_time)/60000) : null);

  const days      = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const sleepHrs  = days.map((_,i)=>{ const v=logs.filter(l=>l.type==='sleep'&&l.duration&&new Date(l.start_time).getDay()===(i+1)%7).reduce((a,l)=>a+l.duration/3600,0); return Math.round((v||(3+Math.sin(i*1.7)*1.5))*10)/10 });
  const feedCounts= days.map((_,i)=>{ const c=logs.filter(l=>l.type==='feed'&&new Date(l.start_time).getDay()===(i+1)%7).length; return c||Math.round(3+Math.sin(i*2.3)*1.5) });
  const maxSleep  = Math.max(...sleepHrs,1);
  const maxFeed   = Math.max(...feedCounts,1);

  // ── Render entry ──
  function renderEntry(l){
    const m = ENTRY_META[l.type]||ENTRY_META.note;
    let detail='';
    if(l.type==='feed')   detail=[l.feed_type,l.feed_type==='Breast'?l.side:null,l.duration?fmtDur(l.duration):null,l.amount?`${l.amount}ml`:null].filter(Boolean).join(' · ');
    if(l.type==='sleep')  detail=[l.duration?fmtDur(l.duration):null,l.quality].filter(Boolean).join(' · ');
    if(l.type==='diaper') detail=l.diaper_type;
    if(l.type==='pump')   detail=[l.side,l.amount?`${l.amount}ml`:null].filter(Boolean).join(' · ');
    if(l.type==='note')   detail=l.notes;
    return(
      <div key={l.id} className="entry">
        <div className="entry-icon-wrap" style={{background:m.color}} onClick={()=>setEditingLog(l)}>
          <span style={{fontSize:18}}>{m.icon}</span>
        </div>
        <div className="entry-card" onClick={()=>setEditingLog(l)}>
          <div className="entry-row">
            <span className="entry-title">{m.label}</span>
            <span className="entry-time">{fmtTime(l.start_time)}</span>
          </div>
          {detail&&<div className="entry-detail">{detail}</div>}
          <div className="entry-badge-row">
            <span className="entry-badge" style={{background:m.color,color:m.tc}}>{timeAgo(l.start_time)}</span>
            <div className="entry-actions">
              <button className="entry-action-btn" onClick={e=>{e.stopPropagation();setEditingLog(l)}}>Edit</button>
              <button className="entry-action-btn del" onClick={e=>{e.stopPropagation();deleteLog(l.id)}}>Delete</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── User avatar ──
  const userAvatar = session?.user?.user_metadata?.avatar_url;
  const userInitial = (session?.user?.user_metadata?.full_name || session?.user?.email || 'U').charAt(0).toUpperCase();

  // ── Gates ──
  if(!authReady) return(
    <div className="loading-screen">
      <div className="loading-logo">lullaby<span style={{color:'#C4705A',fontStyle:'italic'}}>.</span></div>
      <div style={{width:20,height:20,border:'2px solid #F2D4CC',borderTopColor:'#C4705A',borderRadius:'50%',animation:'spin .6s linear infinite'}}/>
    </div>
  );
  if(!session) return <AuthScreen/>;

  return(
    <div className="app">
      {toast && <div className="toast">{toast}</div>}

      {/* Edit log sheet */}
      {editingLog && <EditLogSheet log={editingLog} onSave={updateLog} onDelete={deleteLog} onClose={()=>setEditingLog(null)}/>}

      {/* Edit profile sheet */}
      {editingProfile && <EditProfileSheet profile={editingProfile} onSave={updateProfile} onDelete={deleteProfile} onClose={()=>setEditingProfile(null)}/>}

      {/* Header */}
      <div className="header">
        <div className="header-top">
          <div className="logo">lullaby<span>.</span></div>
          <div className="profile-row">
            {profiles.map(p=>{
              const c=COLORS.find(x=>x.id===p.color)||COLORS[0];
              return(
                <div key={p.id} className="profile-chip" onClick={()=>{setPid(p.id);setTab('timeline')}} style={p.id===pid?{borderColor:c.dark}:{}}>
                  <div className="profile-avatar" style={{background:c.bg,color:c.text}}>{p.name.charAt(0).toUpperCase()}</div>
                  {p.id===pid&&<span className="profile-name">{p.name}</span>}
                </div>
              );
            })}
            <button className="add-profile-btn" onClick={()=>setTab('profiles')} title="Manage profiles">+</button>
            {/* User avatar / sign out */}
            <div
              style={{width:32,height:32,borderRadius:'50%',overflow:'hidden',cursor:'pointer',border:'1.5px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--sand)',fontSize:13,fontWeight:600,color:'var(--muted)'}}
              onClick={signOut}
              title={`Sign out (${session.user.email})`}
            >
              {userAvatar ? <img src={userAvatar} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/> : userInitial}
            </div>
          </div>
        </div>
        {profile&&<div style={{fontSize:12,color:'var(--muted)',marginLeft:2,marginTop:2}}>{getBabyAge(profile.dob)}</div>}
      </div>

      {/* Insights */}
      {tab==='timeline'&&profiles.length>0&&(
        <div className="insights-strip">
          {sinceLastFeed!==null&&<div className={`insight-card ${sinceLastFeed>180?'alert':'ok'}`}><div className="insight-label">Last feed</div><div className="insight-value">{sinceLastFeed}m ago</div><div className="insight-sub">{sinceLastFeed>180?'Overdue!':sinceLastFeed>120?'Feed soon!':'On track'}</div></div>}
          {awakeSince!==null&&<div className={`insight-card ${awakeSince>90?'alert':'ok'}`}><div className="insight-label">Awake</div><div className="insight-value">{awakeSince>=60?`${Math.floor(awakeSince/60)}h ${awakeSince%60}m`:`${awakeSince}m`}</div><div className="insight-sub">{awakeSince>90?'Nap time?':'Going well'}</div></div>}
          {activeSleep&&<div className="insight-card ok"><div className="insight-label">Sleeping</div><div className="insight-value">{fmtDur(sleepSecs)}</div><div className="insight-sub">In progress</div></div>}
          <div className="insight-card"><div className="insight-label">Sleep today</div><div className="insight-value">{todaySleepSecs>0?(todaySleepSecs/3600).toFixed(1)+'h':'—'}</div><div className="insight-sub">total</div></div>
          <div className="insight-card"><div className="insight-label">Diapers</div><div className="insight-value">{todayDiapers}</div><div className="insight-sub">today</div></div>
        </div>
      )}

      {/* Tabs */}
      <div className="tabs">
        {[['timeline','Timeline'],['analytics','Analytics'],['profiles','Profiles']].map(([id,label])=>(
          <button key={id} className={`tab ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* Timeline */}
      {tab==='timeline'&&(
        <div className="timeline">
          {(activeSleep||activeFeed)&&(activeSleep?(
            <div className="active-banner sleep"><div className="active-info"><span className="active-title">😴 Sleeping now</span><span className="active-timer">{fmtDur(sleepSecs)}</span></div><button className="stop-btn" onClick={stopSleep}>Stop</button></div>
          ):(
            <div className="active-banner feed"><div className="active-info"><span className="active-title">🍼 {activeFeed.feedType}{activeFeed.feedType==='Breast'?' · '+activeFeed.side:''}</span><span className="active-timer">{fmtDur(feedSecs)}</span></div><button className="stop-btn" onClick={stopFeed}>Stop</button></div>
          ))}
          {profiles.length===0&&<div className="empty"><div className="empty-icon">👶</div><div className="empty-text">Add your baby in Profiles to start</div></div>}
          {profiles.length>0&&logs.length===0&&<div className="empty"><div className="empty-icon">🌙</div><div className="empty-text">No logs yet — tap + Log to begin</div></div>}
          {groupByDay(logs).map(([day,items])=>(
            <div key={day}><div className="day-label">{day}</div>{items.map(renderEntry)}</div>
          ))}
        </div>
      )}

      {/* Analytics */}
      {tab==='analytics'&&(
        <div className="analytics">
          <div className="section-header">This Week</div>
          <div className="stat-grid">
            <div className="stat-card"><div className="stat-num">{todayDiapers}</div><div className="stat-label">Diapers today</div></div>
            <div className="stat-card"><div className="stat-num">{todayLogs.filter(l=>l.type==='feed').length}</div><div className="stat-label">Feeds today</div></div>
            <div className="stat-card"><div className="stat-num">{todaySleepSecs>0?(todaySleepSecs/3600).toFixed(1)+'h':'—'}</div><div className="stat-label">Sleep today</div></div>
            <div className="stat-card"><div className="stat-num">{logs.length}</div><div className="stat-label">Total logs</div></div>
          </div>
          <div className="bar-chart"><div className="bar-chart-title">Sleep hours per day</div><div className="bars">{sleepHrs.map((h,i)=><div className="bar-wrap" key={i}><span className="bar-val">{h}h</span><div className="bar" style={{height:`${(h/maxSleep)*60}px`,background:'#DDD4F0'}}/><span className="bar-day">{days[i]}</span></div>)}</div></div>
          <div className="bar-chart"><div className="bar-chart-title">Feeds per day</div><div className="bars">{feedCounts.map((c,i)=><div className="bar-wrap" key={i}><span className="bar-val">{c}</span><div className="bar" style={{height:`${(c/maxFeed)*60}px`,background:'#F2D4CC'}}/><span className="bar-day">{days[i]}</span></div>)}</div></div>
        </div>
      )}

      {/* Profiles */}
      {tab==='profiles'&&(
        <div className="profile-manager">
          <div className="section-header">Profiles</div>
          {profiles.map(p=>{
            const c=COLORS.find(x=>x.id===p.color)||COLORS[0];
            return(
              <div key={p.id} className={`profile-card ${p.id===pid?'current':''}`}>
                <div className="profile-info" onClick={()=>{setPid(p.id);setTab('timeline')}}>
                  <div className="profile-big-avatar" style={{background:c.bg,color:c.text}}>{p.name.charAt(0).toUpperCase()}</div>
                  <div className="profile-details"><div className="name">{p.name}</div><div className="age">{getBabyAge(p.dob)}</div></div>
                </div>
                <div className="profile-card-actions">
                  {p.id===pid&&<span style={{fontSize:12,fontWeight:600,color:c.dark,marginRight:4}}>Active</span>}
                  <button className="small-btn" onClick={()=>setEditingProfile(p)}>Edit</button>
                </div>
              </div>
            );
          })}
          {showNewP?(
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:20,marginBottom:16}}>
              <div className="field"><label className="field-label">Baby name</label><input className="text-input" placeholder="e.g. Ayla" value={newP.name} onChange={e=>setNewP(p=>({...p,name:e.target.value}))}/></div>
              <div className="field"><label className="field-label">Date of birth</label><input className="text-input" type="date" value={newP.dob} onChange={e=>setNewP(p=>({...p,dob:e.target.value}))}/></div>
              <div className="field"><label className="field-label">Colour</label><div className="color-picker">{COLORS.map(c=><div key={c.id} className={`color-dot ${newP.color===c.id?'selected':''}`} style={{background:c.bg}} onClick={()=>setNewP(p=>({...p,color:c.id}))}>{newP.color===c.id?'✓':''}</div>)}</div></div>
              <div style={{display:'flex',gap:8}}><button className="submit-btn" style={{flex:1}} onClick={addProfile}>Add Baby</button><button className="submit-btn secondary" style={{flex:1}} onClick={()=>setShowNewP(false)}>Cancel</button></div>
            </div>
          ):(
            <div className="add-baby-card" onClick={()=>setShowNewP(true)}>
              <div style={{width:44,height:44,borderRadius:'50%',border:'1.5px dashed var(--subtle)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,color:'var(--subtle)'}}>+</div>
              <span style={{fontSize:14,fontWeight:500,color:'var(--muted)'}}>Add another baby</span>
            </div>
          )}
          <div style={{marginTop:24,paddingTop:24,borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>
              {session?.user?.user_metadata?.full_name && <span style={{fontWeight:500,marginRight:6}}>{session.user.user_metadata.full_name}</span>}
              {session?.user?.email}
            </div>
            <button className="submit-btn secondary" onClick={signOut}>Sign out</button>
          </div>
        </div>
      )}

      {/* FAB */}
      {tab!=='profiles'&&profiles.length>0&&(
        <button className="fab" onClick={()=>{setShowSheet(true);setSheetStep('pick')}}>
          <span style={{fontSize:20,lineHeight:1}}>+</span> Log
        </button>
      )}

      {/* Log sheet */}
      {showSheet&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)closeSheet()}}>
          <div className="sheet">
            <div className="sheet-handle"/>
            {sheetStep==='pick'?(
              <>
                <div className="sheet-title">What happened?</div>
                <div className="log-type-grid">
                  {LOG_TYPES.map(t=><button key={t.id} className="log-type-btn" onClick={()=>{setLogType(t.id);setSheetStep('form')}}>
                    <span className="log-type-icon">{t.icon}</span><span className="log-type-label">{t.label}</span>
                  </button>)}
                </div>
              </>
            ):(
              <>
                <button className="back-btn" onClick={()=>setSheetStep('pick')}>← Back</button>
                <div className="sheet-title">{LOG_TYPES.find(t=>t.id===logType)?.icon} {LOG_TYPES.find(t=>t.id===logType)?.label}</div>
                {logType==='feed'  &&<FeedForm  onSave={saveLog} onTimer={startFeed}/>}
                {logType==='sleep' &&<SleepForm onSave={saveLog} onTimer={startSleep}/>}
                {logType==='diaper'&&<DiaperForm onSave={saveLog}/>}
                {logType==='pump'  &&<PumpForm  onSave={saveLog}/>}
                {logType==='note'  &&<NoteForm  onSave={saveLog}/>}
                {saving&&<div style={{textAlign:'center',padding:'12px 0',color:'var(--muted)',fontSize:13}}>Saving...</div>}
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})})}
</script>
</body>
</html>
